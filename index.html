<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Urn</title>
<link rel="icon" href="assets/img/Soul_Urn.png">
<style>
  :root {
    --bg-deep: #0d0c0a;
    --soul: #6fe6b8;
    --gold: #e8c46a;
    --ink: #1c1a17;
    --paper: #efe6d2;
    --bad: #ff6b5e;
    --panel: rgba(18, 17, 15, 0.82);
    --slot: rgba(60, 58, 54, 0.6);
    --basic: #6a655c;
    --weapon: #b9731f;
    --spirit: #7c58a8;
    --vitality: #5b8f2e;
    --shop-paper: #b9a98c;
    --shop-trim: #4a4337;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg-deep) center / cover no-repeat;
    color: var(--paper);
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    font-weight: 700;
    overflow: hidden;
    user-select: none;
  }
  button { font: inherit; }

  #room { position: fixed; inset: 0; display: block; touch-action: none; cursor: none; }

  .key {
    display: inline-block; min-width: 18px; padding: 1px 5px;
    background: var(--paper); color: var(--ink); border-radius: 3px;
    font-size: 11px; text-align: center;
  }

  #clock {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    background: var(--panel); padding: 4px 16px; border-radius: 4px;
    font-size: 15px; letter-spacing: 1px; pointer-events: none;
  }

  #menu { position: fixed; top: 10px; right: 12px; display: flex; align-items: center; gap: 6px; }
  #menu button, #menu label {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    background: var(--panel); color: var(--paper);
    border: 0; border-radius: 4px; font-size: 12px; padding: 6px 10px;
  }
  #menu button:hover { background: rgba(60, 58, 54, 0.95); }
  #menu button.warn { color: var(--bad); }
  #menu input[type=range] { width: 90px; accent-color: var(--soul); }

  #hud {
    position: fixed; left: 16px; bottom: 12px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px; pointer-events: none;
  }
  #integrity {
    position: relative; width: 190px; height: 30px; margin-left: 6px; transform: skewX(-12deg);
    background: rgba(20, 40, 24, 0.9); border: 2px solid #20301f; overflow: hidden; pointer-events: auto;
  }
  #leakFill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: var(--paper); }
  #leakLabel {
    position: relative; display: block; padding-left: 10px; line-height: 26px; transform: skewX(12deg);
    font-size: 16px; color: #fff; text-shadow: 0 1px 2px #000, 0 0 4px #000;
  }
  #soulRow { display: flex; align-items: center; gap: 10px; }
  #level {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #141412; border: 3px solid #2f6b4f; font-size: 18px; pointer-events: auto;
  }
  #score {
    display: flex; align-items: baseline; gap: 6px;
    font-size: 30px; color: var(--soul); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.6);
  }
  #score img { height: 30px; align-self: center; }
  #score small { font-size: 12px; color: var(--paper); letter-spacing: 1px; }
  #haunted { font-size: 12px; color: #e58a7e; text-shadow: 0 1px 2px #000; pointer-events: auto; }
  #buffs { display: grid; grid-template-columns: repeat(5, 40px); gap: 4px; pointer-events: auto; }
  .slot { position: relative; width: 40px; height: 40px; background: var(--slot); border-radius: 3px; }
  .slot img { width: 100%; height: 100%; object-fit: contain; }
  .slot span { position: absolute; right: 3px; bottom: 0; font-size: 12px; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
  #shopButton {
    display: flex; align-items: center; gap: 6px; cursor: pointer; pointer-events: auto;
    background: var(--panel); color: var(--paper);
    border: 0; border-radius: 4px; padding: 5px 10px; font-size: 12px; letter-spacing: 1px;
  }
  #shopButton:hover { background: rgba(60, 58, 54, 0.95); }

  #toolbar {
    position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 8px;
    width: max-content; max-width: min(660px, 96vw);
  }
  .tool {
    width: 56px; padding: 0; cursor: pointer; background: none; border: 0; color: var(--paper);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tool .disc {
    width: 54px; height: 54px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #1b1a18; border: 2px solid #3a3835;
  }
  .tool .icon { width: 34px; height: 34px; object-fit: contain; }
  .tool:hover .disc { border-color: var(--paper); }
  .tool.selected .disc { border: 3px solid var(--paper); box-shadow: 0 0 12px rgba(239, 230, 210, 0.7); }
  .tool.locked { display: none; }

  #shop {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -54%); z-index: 6;
    width: min(440px, 92vw); max-height: 76vh; display: none; flex-direction: column;
    background: var(--shop-paper); color: var(--ink);
    border: 3px solid var(--shop-trim); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
  }
  #shop.open { display: flex; }
  #shop header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; background: var(--shop-trim); color: var(--paper); font-size: 20px;
  }
  #shop header button { background: none; border: 0; color: var(--paper); font-size: 18px; cursor: pointer; }
  #shopList { display: flex; flex-direction: column; gap: 3px; padding: 8px; overflow-y: auto; }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 6px 10px;
    border: 0; cursor: pointer; text-align: left; color: #fff; font-size: 15px;
  }
  .row.basic { background: var(--basic); }
  .row.weapon { background: var(--weapon); }
  .row.spirit { background: var(--spirit); }
  .row.vitality { background: var(--vitality); }
  .shopHead { padding: 6px 4px 2px; font-size: 12px; letter-spacing: 1px; }
  .row:hover { filter: brightness(1.15); }
  .row.poor { opacity: 0.55; }
  .row .icon { width: 38px; height: 38px; padding: 3px; object-fit: contain; background: rgba(0, 0, 0, 0.35); border-radius: 3px; }
  .row .info { flex: 1; display: flex; flex-direction: column; }
  .row .price { display: flex; align-items: center; gap: 3px; font-size: 14px; color: #bdfbe0; }
  .row .price img { height: 13px; }
  .row .state { font-size: 11px; letter-spacing: 1px; }
  #shop footer { padding: 8px 16px; font-size: 12px; background: #a39479; }
  .nope { animation: nope 0.3s linear; }

  #tip {
    position: fixed; left: 0; top: 0; z-index: 20; display: none; max-width: 250px;
    background: rgba(18, 17, 15, 0.96); border: 1px solid #6f6453; border-left: 3px solid var(--soul);
    padding: 7px 10px; font-size: 13px; font-weight: 400; line-height: 1.35; pointer-events: none;
  }
  #tip b { display: block; color: var(--soul); font-weight: 700; }

  #bubble {
    position: fixed; left: 0; top: 0;
    max-width: min(380px, 80vw); width: max-content;
    background: var(--paper); color: var(--ink);
    padding: 10px 14px; border-radius: 14px;
    font-size: 17px; line-height: 1.3; text-align: center;
    opacity: 0; transition: opacity 0.15s; pointer-events: none;
  }
  #bubble.show { opacity: 1; }

  #start {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(4, 10, 9, 0.9); cursor: pointer; text-align: center; padding: 16px;
  }
  #start h1 { margin: 0; font-size: clamp(30px, 6vw, 60px); color: var(--gold); letter-spacing: 3px; }
  #start p { margin: 0; font-size: 17px; opacity: 0.85; font-weight: 400; }
  #start .go { color: var(--soul); font-weight: 700; text-shadow: 0 0 12px var(--soul); animation: bob 1.2s ease-in-out infinite; }

  /* Tablet and narrower: the ability bar needs the bottom edge, so the HUD moves to the top left. */
  @media (max-width: 1150px) {
    #hud { top: 48px; bottom: auto; }
    #buffs { grid-template-columns: repeat(5, 30px); }
    .slot { width: 30px; height: 30px; }
  }

  @media (max-width: 900px) {
    #clock { display: none; }
  }

  /* Phone: two rows of five abilities, and the menu becomes a scrolling strip along the top. */
  @media (max-width: 700px) {
    #menu { left: 8px; right: 8px; top: 6px; overflow-x: auto; }
    #menu button, #menu label { flex: 0 0 auto; white-space: nowrap; }
    #toolbar { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; width: 96vw; max-width: 96vw; }
    .tool { flex: 0 0 auto; }
    .tool { width: 50px; }
    .tool .disc { width: 46px; height: 46px; }
    .tool .icon { width: 28px; height: 28px; }
    #score { font-size: 24px; }
    #integrity { width: 150px; height: 26px; }
    #leakLabel { line-height: 22px; font-size: 14px; }
  }

  @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
  @keyframes nope { 0%, 100% { translate: 0 0; } 25% { translate: -5px 0; } 75% { translate: 5px 0; } }
</style>
</head>

<canvas id="room"></canvas>

<div id="clock">0:00</div>

<div id="menu">
  <button id="mapButton" type="button">Map</button>
  <button id="trackButton" type="button">Music</button>
  <label>Volume <input id="volume" type="range" min="0" max="100" value="60"></label>
  <button id="resetButton" type="button">Reset</button>
</div>

<div id="hud">
  <div id="integrity" data-tip="Integrity">
    <div id="leakFill"></div><span id="leakLabel">100 / 100</span>
  </div>
  <div id="soulRow">
    <div id="level" data-tip="Urns shattered">0</div>
    <div>
      <div id="score"><img src="assets/img/Souls_icon.png" alt=""><span id="scoreValue">0</span><small>SOULS</small></div>
      <div id="haunted" data-tip="Haunted souls"></div>
    </div>
  </div>
  <div id="buffs"></div>
  <button id="shopButton" type="button"><span class="key">B</span> SHOP</button>
</div>

<div id="bubble"></div>
<div id="tip"></div>
<div id="toolbar"></div>

<div id="shop">
  <header><span>Curiosity Shop</span><button id="shopClose" type="button" aria-label="Close shop">X</button></header>
  <div id="shopList"></div>
  <footer><span class="key">ESC</span> Back</footer>
</div>

<div id="start">

  <p class="go">Click to begin</p>
</div>

  // ---- Permanent buffs ----

  function getBuff(id) {
    return (1 + buffSteps[id] * (buffs[id] || 0)) * (1 + (itemBonus[id] || 0));
  }

  function pickBuff() {
    var total = BUFFS.reduce(function (sum, def) { return sum + def.weight; }, 0);
    var roll = Math.random() * total;
    for (var i = 0; i < BUFFS.length; i++) {
      roll -= BUFFS[i].weight;
      if (roll < 0) return BUFFS[i];
    }
    return BUFFS[0];
  }

  // One item slot per buff type, like the inventory grid in a match.
  function renderBuffs() {
    buffPanel.textContent = '';
    BUFFS.forEach(function (def) {
      var count = buffs[def.id] || 0;
      var slot = document.createElement('div');
      slot.className = 'slot';
      if (count) {
        slot.dataset.tip = def.name + ' x' + count + '|+' + Math.round(def.step * count * 100) + '%: ' + def.effect + '.';
        slot.innerHTML = '<img src="' + IMG_DIR + def.tome + '" alt=""><span>' + count + '</span>';
      }
      buffPanel.appendChild(slot);
    });
  }

  function grantBuff(def) {
    buffs[def.id] = (buffs[def.id] || 0) + 1;
    saveDirty = true;
    renderBuffs();

  function spawnTome(x, y, vx, vy) {
    tomes.push({ x: x, y: y, vx: vx, vy: vy, buff: pickBuff(), sway: rand(0, 6.28) });
  }

  function updateTomes(dt) {
    var reach = SOUL_COLLECT_RADIUS * getBuff('moveSpeed');
    var rest = floorY - TOME_SIZE / 2 - 4;
    for (var i = tomes.length - 1; i >= 0; i--) {
      var tome = tomes[i];
      tome.vy += GRAVITY * dt;
      tome.vx *= 1 - Math.min(1, 2 * dt);
      tome.x = clamp(tome.x + tome.vx * dt, 30, width - 30);
      tome.y += tome.vy * dt;
      if (tome.y > rest) { tome.y = rest; tome.vy = 0; }
      var dx = tome.x - pointer.x;
      var dy = tome.y - pointer.y;
      if (dx * dx + dy * dy < reach * reach) {
        grantBuff(tome.buff);
        addText(tome.x, tome.y - 30, '+' + tome.buff.name, '#e8c46a');
        tomes.splice(i, 1);
      }
    }
  }

  // ---- Buff containers (golden statues) ----

  function spawnStatue() {
    var x = rand(70, width - 70);
    // Keep it off the urn so it is not smashed the instant it appears.
    if (Math.abs(x - urn.x) < urn.h * 0.7) x = urn.x < width / 2 ? width - 90 : 90;
    statues.push({ x: x });
  }

  function findStatueAt(x, y) {
    for (var i = 0; i < statues.length; i++) {
      if (Math.abs(x - statues[i].x) < STATUE_HEIGHT * 0.38 && y > floorY - STATUE_HEIGHT && y < floorY) return statues[i];
    }
    return null;
  }

  // Nearest statue a ray hits before `limit`, with the distance to it.
  function findStatueOnRay(ox, oy, dx, dy, limit) {
    var hit = null;
    var radius = STATUE_HEIGHT * 0.4;
    statues.forEach(function (statue) {
      var cx = statue.x - ox;
      var cy = floorY - STATUE_HEIGHT / 2 - oy;
      var along = cx * dx + cy * dy;
      if (along < 0 || along > limit) return;
      if (cx * cx + cy * cy - along * along > radius * radius) return;
      if (!hit || along < hit.reach) hit = { statue: statue, reach: along };
    });
    return hit;
  }

  function breakStatue(statue) {
    statues.splice(statues.indexOf(statue), 1);
    var middle = floorY - STATUE_HEIGHT / 2;
    burstParticles('gold', statue.x, middle, 18, 420);
    burstParticles('smoke', statue.x, middle, 6, 120);
    addEffect('impact', statue.x, middle, 1.3);
    if (Math.random() < STATUE_BUFF_CHANCE) spawnTome(statue.x, middle, rand(-60, 60), -420);
    else addText(statue.x, floorY - STATUE_HEIGHT, 'Empty', '#f3ead2');
  }

  function updateStatues(now) {
    if (now > nextStatueAt) {
      nextStatueAt = now + STATUE_INTERVAL_MS;
      // An uncollected tome holds up the next statue, like in the game.
      if (statues.length + tomes.length < MAX_STATUES) spawnStatue();
    }
    if (Math.abs(urn.vx) + Math.abs(urn.vy) < STATUE_BREAK_SPEED) return;
    var extents = getUrnExtents();
    for (var i = statues.length - 1; i >= 0; i--) {

  }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var barHeight = toolbar.offsetHeight + 16;
    floorY = height - barHeight - 10;

    urn.w = urn.h * URN_ASPECT;

    if (!urnPlaced && width > 0 && height > 0) {
      urnPlaced = true;
      urn.x = width / 2;
      urn.y = floorY - urn.h / 2;
    }
  }

  function rotate(x, y, angle) {
    var c = Math.cos(angle);
    var s = Math.sin(angle);
    return { x: x * c - y * s, y: x * s + y * c };
  }

  function toUrnLocal(x, y) { return rotate(x - urn.x, y - urn.y, -urn.a); }
  function fromUrnLocal(lx, ly) { return rotate(lx, ly, urn.a); }

  function checkInsideUrn(x, y, pad) {
    if (urn.broken) return false;
    var local = toUrnLocal(x, y);
    return Math.abs(local.x) < urn.w * HITBOX_SCALE / 2 * pad && Math.abs(local.y) < urn.h / 2 * pad;
  }

  function getUrnExtents() {
    var c = Math.abs(Math.cos(urn.a));
    var s = Math.abs(Math.sin(urn.a));
    var w = urn.w * HITBOX_SCALE;
    return { x: (c * w + s * urn.h) / 2, y: (s * w + c * urn.h) / 2 };
  }

  // Distance along a ray to the urn's hit box, or -1 on a miss.
  function castRayAtUrn(ox, oy, dx, dy) {
    if (urn.broken) return -1;
    var o = toUrnLocal(ox, oy);
    var d = rotate(dx, dy, -urn.a);
    var half = [urn.w * HITBOX_SCALE / 2, urn.h / 2];
    var origin = [o.x, o.y];
    var dir = [d.x, d.y];
    var near = -Infinity;
    var far = Infinity;
    for (var axis = 0; axis < 2; axis++) {
      if (Math.abs(dir[axis]) < 1e-6) {
        if (Math.abs(origin[axis]) > half[axis]) return -1;
        continue;
      }
      var t1 = (-half[axis] - origin[axis]) / dir[axis];
      var t2 = (half[axis] - origin[axis]) / dir[axis];
      near = Math.max(near, Math.min(t1, t2));
      far = Math.min(far, Math.max(t1, t2));
    }
    if (far < Math.max(near, 0)) return -1;
    return Math.max(near, 0);
  }

  // ---- Fracture ----

  // The urn image is cut along a jittered grid into the shards he shatters into.
  function buildFracture() {
    var points = [];
    var across = [];
    var down = [];
    var r;
    var c;
    function buildEdge(a, b) {
      return [a, [(a[0] + b[0]) / 2 + rand(-0.035, 0.035), (a[1] + b[1]) / 2 + rand(-0.03, 0.03)], b];
    }
    for (r = 0; r <= FRACTURE_ROWS; r++) {
      points.push([]);
      for (c = 0; c <= FRACTURE_COLS; c++) {
        var inner = r > 0 && r < FRACTURE_ROWS && c > 0 && c < FRACTURE_COLS;
        points[r].push([c / FRACTURE_COLS + (inner ? rand(-0.09, 0.09) : 0), r / FRACTURE_ROWS + (inner ? rand(-0.05, 0.05) : 0)]);
      }
    }
    for (r = 0; r <= FRACTURE_ROWS; r++) {
      across.push([]);
      for (c = 0; c < FRACTURE_COLS; c++) across[r].push(buildEdge(points[r][c], points[r][c + 1]));
    }
    for (r = 0; r < FRACTURE_ROWS; r++) {
      down.push([]);
      for (c = 0; c <= FRACTURE_COLS; c++) down[r].push(buildEdge(points[r][c], points[r + 1][c]));
    }
    for (r = 0; r < FRACTURE_ROWS; r++) {
      for (c = 0; c < FRACTURE_COLS; c++) {
        var outline = across[r][c]
          .concat(down[r][c + 1].slice(1))
          .concat(across[r + 1][c].slice().reverse().slice(1))
          .concat(down[r][c].slice().reverse().slice(1));
        var cx = 0;
        var cy = 0;
        outline.forEach(function (p) { cx += p[0] / outline.length; cy += p[1] / outline.length; });
        shardShapes.push({ points: outline, cx: cx, cy: cy });
      }
    }
  }

  // How many hairline cracks show: none while he is healthy, all of them just before he breaks.
  function getDamageStage() {
    var strain = stress / BREAK_AT;
    if (strain < FRACTURE_START) return 0;
    return Math.min(CRACK_COUNT, 1 + Math.floor((strain - FRACTURE_START) / (1 - FRACTURE_START) * CRACK_COUNT));
  }

  // Wandering hairlines across his body, in image space (0..1). Built once, so they appear in a fixed order.
  function buildCracks() {
    function wander(x, y, heading, steps) {
      var path = [[x, y]];
      for (var i = 0; i < steps; i++) {
        heading += rand(-0.55, 0.55);
        var length = rand(0.03, 0.055);
        x += Math.cos(heading) * length / URN_ASPECT;
        y += Math.sin(heading) * length;
        if (x < 0.14 || x > 0.86 || y < 0.08 || y > 0.84) break;
        path.push([x, y]);
      }
      return path;
    }
    for (var i = 0; i < CRACK_COUNT; i++) {
      var heading = rand(0, Math.PI * 2);
      var trunk = wander(rand(0.25, 0.75), rand(0.15, 0.78), heading, 6);
      var fork = trunk[Math.floor(trunk.length / 2)];
      var turn = rand(0.7, 1.3) * (Math.random() < 0.5 ? 1 : -1);
      crackPaths.push([trunk, wander(fork[0], fork[1], heading + turn, 3)]);
    }
  }

  function strokeCracks(visible, scale, offset) {
    crackCtx.beginPath();
    for (var i = 0; i < visible; i++) {
      crackPaths[i].forEach(function (path) {
        path.forEach(function (p, index) {
          var x = p[0] * urn.w * scale + offset;
          var y = p[1] * urn.h * scale + offset;
          if (index === 0) crackCtx.moveTo(x, y); else crackCtx.lineTo(x, y);
        });
      });
    }
    crackCtx.stroke();
  }

  // The urn is pre-rendered with its cracks so they stay clipped to his silhouette. Each crack is a dark
  // hairline with a pale edge beside it, about the weight of the pattern etched into the jar.
  function renderUrn() {
    if (!urnImg.complete || !urnImg.naturalWidth || !urn.w) return;
    var scale = window.devicePixelRatio || 1;
    crackCanvas.width = Math.ceil(urn.w * scale);
    crackCanvas.height = Math.ceil(urn.h * scale);
    crackCtx.drawImage(urnImg, 0, 0, crackCanvas.width, crackCanvas.height);
    urnDirty = false;
    renderedStage = getDamageStage();
    if (!renderedStage) return;
    crackCtx.globalCompositeOperation = 'source-atop';
    crackCtx.lineCap = 'round';
    crackCtx.lineJoin = 'round';
    crackCtx.strokeStyle = 'rgba(10, 44, 52, 0.7)';
    crackCtx.lineWidth = 1.3 * scale;
    strokeCracks(renderedStage, scale, 0);
    crackCtx.strokeStyle = 'rgba(222, 250, 255, 0.6)';
    crackCtx.lineWidth = 0.6 * scale;
    strokeCracks(renderedStage, scale, 0.9 * scale);
  }

  function breakUrn() {
    var now = performance.now();
    for (var i = 0; i < BREAK_SOULS; i++) spawnSoul();
    shards = shardShapes.map(function (shape) {
      var offset = fromUrnLocal((shape.cx - 0.5) * urn.w, (shape.cy - 0.5) * urn.h);
      return {
        shape: shape, x: urn.x + offset.x, y: urn.y + offset.y, a: urn.a,
        vx: offset.x * 6 + urn.vx * 0.4 + rand(-200, 200),
        vy: offset.y * 6 + urn.vy * 0.4 - rand(200, 600),
        va: rand(-9, 9), born: now
      };
    });
    fillBag(Math.round(BREAK_BAG_SOULS * getBuff('health')), urn.x);
    addText(urn.x, urn.y - urn.h / 2, 'SHATTERED!', '#e8c46a');
    addEffect('flash', urn.x, urn.y, urn.h * 1.6);
    burstParticles('soul', urn.x, urn.y, 30, 520);
    urn.broken = true;
    urn.grabbed = false;
    shatters++;
    levelBadge.textContent = shatters;
    saveDirty = true;
    respawnAt = now + RESPAWN_MS / getBuff('cooldown');
    stress = 0;
    leak = 0;
    burnUntil = 0;
    shake = MAX_SHAKE;
    bombs = bombs.filter(function (bomb) { return !bomb.stuck; });
    say('mix_break', true);
  }

  // A fresh urn descends from the sky, the way a new one arrives in a match.
  function respawnUrn() {
    urn.broken = false;
    urn.descending = true;
    anger = 0;
    urn.x = width / 2;
    urn.y = -urn.h / 2;
    urn.vx = 0;
    urn.vy = 0;
    urn.a = 0;
    urn.va = 0;
    urnDirty = true;
    lastEventAt = performance.now();
    announce.currentTime = 0;
    announce.play().catch(function () {});
    say('idol_dropping', true);
  }

  function updateShards(now, dt) {
    for (var i = shards.length - 1; i >= 0; i--) {
      var shard = shards[i];
      shard.vy += GRAVITY * dt;
      shard.x += shard.vx * dt;
      shard.y += shard.vy * dt;
      shard.a += shard.va * dt;
      if (shard.x < 10 || shard.x > width - 10) {
        shard.x = clamp(shard.x, 10, width - 10);
        shard.vx *= -0.5;
      }
      if (shard.y > floorY - 10 && shard.vy > 0) {
        shard.y = floorY - 10;
        shard.vy *= -0.35;
        shard.vx *= 0.7;
        shard.va *= 0.6;
      }
      if (now - shard.born > SHARD_LIFE_MS) shards.splice(i, 1);
    }
  }

  // ---- Souls ----

  // Soft round sprites, drawn once per colour and stamped for every particle and flash.
  function buildGlows() {
    Object.keys(GLOW_COLORS).forEach(function (name) {
      var sprite = document.createElement('canvas');
      sprite.width = 64;
      sprite.height = 64;
      var c = sprite.getContext('2d');
      var fill = c.createRadialGradient(32, 32, 0, 32, 32, 32);
      fill.addColorStop(0, 'rgba(' + GLOW_COLORS[name] + ', 1)');
      fill.addColorStop(0.35, 'rgba(' + GLOW_COLORS[name] + ', 0.55)');
      fill.addColorStop(1, 'rgba(' + GLOW_COLORS[name] + ', 0)');
      c.fillStyle = fill;
      c.fillRect(0, 0, 64, 64);
      glows[name] = sprite;
    });
  }

  // The soul orb: a bright green sphere with a hot core, a wide bloom and a faint vertical glint.
  function buildSoulSprite() {
    soulSprite.width = 128;
    soulSprite.height = 128;
    var c = soulSprite.getContext('2d');
    var bloom = c.createRadialGradient(64, 64, 4, 64, 64, 64);
    bloom.addColorStop(0, 'rgba(120, 255, 190, 0.85)');
    bloom.addColorStop(0.3, 'rgba(60, 235, 150, 0.35)');
    bloom.addColorStop(1, 'rgba(60, 235, 150, 0)');
    c.fillStyle = bloom;
    c.fillRect(0, 0, 128, 128);
    c.fillStyle = 'rgba(200, 255, 225, 0.2)';
    c.beginPath();
    c.ellipse(64, 64, 2, 40, 0, 0, Math.PI * 2);
    c.fill();
    var sphere = c.createRadialGradient(58, 56, 2, 64, 64, 20);
    sphere.addColorStop(0, '#ffffff');
    sphere.addColorStop(0.3, '#b8ffd9');
    sphere.addColorStop(0.7, '#35e58f');
    sphere.addColorStop(1, '#0e8a57');
    c.beginPath();
    c.arc(64, 64, 20, 0, Math.PI * 2);
    c.fillStyle = sphere;
    c.fill();
    c.clip();
    c.strokeStyle = 'rgba(6, 70, 44, 0.45)';
    c.lineWidth = 2.2;
    c.beginPath();
    c.ellipse(64, 64, 20, 7, 0, 0, Math.PI * 2);
    c.stroke();
    c.beginPath();
    c.ellipse(64, 64, 7, 20, 0, 0, Math.PI * 2);
    c.stroke();
    c.strokeStyle = 'rgba(5, 60, 40, 0.6)';
    c.beginPath();
    c.arc(64, 64, 20, 0, Math.PI * 2);
    c.stroke();
  }

  // The soul bag: a dark metal cage ball with round openings onto a red core, the middle
  // opening holding a triangle plate.
  function buildBagSprite() {
    bagSprite.width = 128;
    bagSprite.height = 128;
    var c = bagSprite.getContext('2d');
    var radius = 58;
    var core = c.createRadialGradient(64, 64, 5, 64, 64, radius);
    core.addColorStop(0, '#7a2a20');
    core.addColorStop(1, '#2a0f0c');
    var metal = c.createLinearGradient(20, 14, 108, 114);
    metal.addColorStop(0, '#8b9a96');
    metal.addColorStop(0.45, '#2b3533');
    metal.addColorStop(1, '#141a19');
    function fillCircle(x, y, r, style) {
      c.beginPath();
      c.arc(x, y, r, 0, Math.PI * 2);
      c.fillStyle = style;
      c.fill();
    }
    function rimCircle(x, y, r) {
      c.lineWidth = 2.5;
      c.strokeStyle = '#0e1312';
      c.beginPath();
      c.arc(x, y, r, 0, Math.PI * 2);
      c.stroke();
      c.strokeStyle = 'rgba(200, 215, 210, 0.35)';
      c.beginPath();
      c.arc(x, y, r + 2, Math.PI * 1.05, Math.PI * 1.6);
      c.stroke();
    }
    c.beginPath();
    c.arc(64, 64, radius, 0, Math.PI * 2);
    c.clip();
    c.fillStyle = metal;
    c.fillRect(0, 0, 128, 128);
    [[18, 64], [110, 64], [64, 18], [64, 110]].forEach(function (spot) {
      fillCircle(spot[0], spot[1], 20, core);
      rimCircle(spot[0], spot[1], 20);
      c.lineWidth = 4;
      c.strokeStyle = metal;
      c.beginPath();
      c.arc(spot[0], spot[1], 11, 0, Math.PI * 2);
      c.stroke();
    });
    fillCircle(64, 64, 26, core);
    rimCircle(64, 64, 26);
    c.fillStyle = metal;
    c.beginPath();
    c.moveTo(64, 42);
    c.lineTo(83, 75);
    c.lineTo(45, 75);
    c.closePath();
    c.fill();
    fillCircle(64, 64, 7, core);
    var shade = c.createRadialGradient(46, 42, 8, 64, 64, radius);
    shade.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
    shade.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
    shade.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
    c.fillStyle = shade;
    c.fillRect(0, 0, 128, 128);
  }

  // Souls burst from where he was hit; with no hit point they seep out of a random spot on him.
  function spawnSoul(originX, originY) {
    if (souls.length >= MAX_SOULS) return;
    if (originX === undefined) {
      var spot = fromUrnLocal(rand(-urn.w / 3, urn.w / 3), rand(-urn.h / 2.2, urn.h / 3));
      originX = urn.x + spot.x;
      originY = urn.y + spot.y;
    }
    var angle = rand(0, Math.PI * 2);
    var speed = rand(120, 420);
    souls.push({
      x: clamp(originX, 14, width - 14), y: Math.min(originY, floorY - 10),
      vx: Math.cos(angle) * speed + urn.vx * 0.3,
      vy: Math.sin(angle) * speed - 200 + urn.vy * 0.3,
      born: performance.now(),
      life: SOUL_LIFE_MS * getBuff('spiritResist'),
      sway: rand(0, 6.28),
      value: Math.round(rand(5, 15) * getBuff('health'))
    });
  }

  function addText(x, y, text, color) {
    texts.push({ x: x, y: y, text: text, color: color, born: performance.now() });
  }

  function addScore(amount) {
    score += amount;
    saveDirty = true;
    scoreValue.textContent = formatSouls(score);
    refreshTools();
    if (score >= nextMilestone) {
      nextMilestone += MILESTONE_SOULS;
      say('idol_delivered', true);
      // Delivering an urn pays out permanent buffs in the game; a soul milestone is the delivery here.
      for (var i = 0; i < URN_DELIVERY_BUFFS; i++) spawnTome(urn.x, urn.y - urn.h / 2, rand(-300, 300), rand(-800, -450));
    }
  }

  function updateSouls(now, dt) {
    var pulling = pointer.down && tool === 'vortex';
    var reach = SOUL_COLLECT_RADIUS * getBuff('moveSpeed');
    for (var i = souls.length - 1; i >= 0; i--) {
      var soul = souls[i];
      var dx = pointer.x - soul.x;
      var dy = pointer.y - soul.y;
      var distance = Math.sqrt(dx * dx + dy * dy) || 1;
      if (pulling) {
        soul.vx += dx / distance * VORTEX_SOUL_PULL * dt;
        soul.vy += dy / distance * VORTEX_SOUL_PULL * dt;
      }
      soul.vx *= 1 - 2 * dt;
      soul.vy += (SOUL_RISE_SPEED - soul.vy) * 2 * dt;
      soul.x += (soul.vx + Math.sin(now / 400 + soul.sway) * 30) * dt;
      soul.y += soul.vy * dt;
      soul.x = clamp(soul.x, 14, width - 14);
      soul.y = Math.min(soul.y, floorY - 10);

      if (distance < reach) {
        addScore(soul.value);
        addText(soul.x, soul.y, '+' + soul.value, '#7dffd0');
        burstParticles('soul', soul.x, soul.y, 3, 120);
        souls.splice(i, 1);
      } else if (now - soul.born > soul.life || soul.y < -40) {
        loseSoul(soul.value);
        souls.splice(i, 1);
      }
    }
  }

  // ---- Urn ----

  function damageUrn(amount, worldX, worldY) {
    if (urn.broken) return;
    urn.descending = false;
    leak = Math.min(MAX_LEAK, leak + amount);
    stress += amount;
    anger = Math.min(100, anger + amount * ANGER_PER_DAMAGE);
    var burst = Math.round(amount * BURST_SOULS_PER_DAMAGE * getBuff('ammo'));
    for (var i = 0; i < burst; i++) spawnSoul(worldX, worldY);
    if (amount >= SHAKE_MIN_DAMAGE) shake = MAX_SHAKE;
    lastEventAt = performance.now();
    lastTouchedAt = lastEventAt;
    if (stress >= BREAK_AT) {
      breakUrn();
      return;
    }
    painBank += amount;
    if (painBank >= TALK_DAMAGE) {
      painBank = 0;
      sayMood('hurt');
    }
  }

  function hitSurface(speed, contactX, contactY) {
    if (speed < IMPACT_MIN_SPEED) return;
    damageUrn((speed - IMPACT_MIN_SPEED) / IMPACT_SPEED_PER_DAMAGE + 1, contactX, contactY);
  }

  function grabUrn() {
    urn.grabbed = true;
    urn.grabDx = pointer.x - urn.x;
    urn.grabDy = pointer.y - urn.y;
    urn.grabbedAt = performance.now();
    lastEventAt = urn.grabbedAt;
    urn.descending = false;
    lastTouchedAt = urn.grabbedAt;
    sayMood('pickup');
  }

  function releaseUrn() {
    if (!urn.grabbed) return;
    urn.grabbed = false;
    lastEventAt = performance.now();
    if (Math.abs(urn.vx) + Math.abs(urn.vy) < 300) say('idol_dropped', false);
  }

  function pushUrn(dx, dy, force, spin) {
    urn.grabbed = false;
    urn.descending = false;
    urn.vx += dx * force;
    urn.vy += dy * force;
    urn.va += spin;
  }

  function updateUrn(now, dt) {
    var extents;
    if (urn.broken) {
      if (now > respawnAt) respawnUrn();
      return;
    }
    if (urn.grabbed) {
      urn.vx = clamp((pointer.x - urn.grabDx - urn.x) * GRAB_STIFFNESS, -MAX_SPEED, MAX_SPEED);
      urn.vy = clamp((pointer.y - urn.grabDy - urn.y) * GRAB_STIFFNESS, -MAX_SPEED, MAX_SPEED);
      urn.x += urn.vx * dt;
      urn.y += urn.vy * dt;
      // He swings from the hand: lean into the direction of travel.
      urn.a += (clamp(urn.vx * 0.0012, -1.1, 1.1) - urn.a) * Math.min(1, 10 * dt);
      urn.va = urn.vx * 0.004;
      extents = getUrnExtents();
      urn.x = clamp(urn.x, extents.x, width - extents.x);
      urn.y = clamp(urn.y, extents.y, floorY - extents.y);
      if (now - Math.max(urn.grabbedAt, lastHeldTalkAt) > HELD_TALK_MS) {
        lastHeldTalkAt = now;
        say('holder_stalls', false);
      }
      return;
    }

    if (urn.descending) urn.vy = DESCENT_SPEED;
    else urn.vy += GRAVITY * dt;
    urn.vx = clamp(urn.vx, -MAX_SPEED, MAX_SPEED);
    urn.vy = clamp(urn.vy, -MAX_SPEED, MAX_SPEED);
    urn.x += urn.vx * dt;
    urn.y += urn.vy * dt;
    urn.a += urn.va * dt;
    extents = getUrnExtents();
    urn.onFloor = false;

    if (urn.y + extents.y > floorY) {
      urn.y = floorY - extents.y;
      urn.onFloor = true;
      urn.descending = false;
      if (urn.vy > 0) {
        hitSurface(urn.vy, urn.x, floorY);
        urn.va += urn.vx * 0.004;
        urn.vy = urn.vy > 160 ? -urn.vy * RESTITUTION : 0;
      }
      urn.vx *= 1 - Math.min(1, FLOOR_FRICTION * dt);
      // Settle onto the nearest flat side so he ends up standing or lying down.
      var flat = Math.round(urn.a / (Math.PI / 2)) * (Math.PI / 2);
      urn.va += (flat - urn.a) * UPRIGHT_SPRING * dt;
      urn.va *= 1 - Math.min(1, UPRIGHT_DAMPING * dt);
    }
    if (urn.y - extents.y < 0) {
      urn.y = extents.y;
      if (urn.vy < 0) { hitSurface(-urn.vy, urn.x, 0); urn.vy = -urn.vy * RESTITUTION; }
    }
    if (urn.x - extents.x < 0) {
      urn.x = extents.x;
      if (urn.vx < 0) { hitSurface(-urn.vx, 0, urn.y); urn.vx = -urn.vx * RESTITUTION; urn.va += urn.vy * 0.003; }
    }
    if (urn.x + extents.x > width) {
      urn.x = width - extents.x;
      if (urn.vx > 0) { hitSurface(urn.vx, width, urn.y); urn.vx = -urn.vx * RESTITUTION; urn.va -= urn.vy * 0.003; }
    }

    if (now - lastEventAt > IDLE_TALK_MS) {
      lastEventAt = now;
      sayMood('idle');
    }
  }

  function updateLeak(dt) {
    var recovery = dt / getBuff('bulletResist');
    leak = Math.max(0, leak - LEAK_DECAY * recovery);
    stress = Math.max(0, stress - STRESS_DECAY * recovery);
    anger = Math.max(0, anger - ANGER_DECAY * dt);
    soulDebt += leak * LEAK_SOULS_PER_SEC * dt;
    while (soulDebt >= 1) { soulDebt--; spawnSoul(); }
    var integrity = urn.broken ? 0 : Math.round((1 - stress / BREAK_AT) * 100);
    leakLabel.textContent = urn.broken ? 'SHATTERED' : integrity + ' / 100';
    leakFill.style.width = integrity + '%';
  }

  // ---- Weapons ----

  function punchUrn(strike) {
    var dx = urn.x - pointer.x;
    var dy = urn.y - pointer.y;
    var length = Math.sqrt(dx * dx + dy * dy) || 1;
    pushUrn(dx / length, dy / length, strike.force, rand(-9, 9));
    urn.vy -= strike.force * 0.35;
    var heavy = strike === HEAVY_MELEE;
    addEffect('impact', pointer.x, pointer.y, heavy ? 2 : 1);
    burstParticles('spark', pointer.x, pointer.y, heavy ? 12 : 5, 420);
    if (heavy) addText(pointer.x, pointer.y - 34, 'HEAVY!', '#e8c46a');
    damageUrn(strike.damage * getBuff('weapon'), pointer.x, pointer.y);
  }

  function fireGun(gun, now) {
    if (now - lastShotAt < gun.intervalMs / getBuff('fireRate')) return;
    lastShotAt = now;
    recoil = 1;
    // The gun sits just off the right end of the ability bar, and every round lands on the crosshair.
    var originX = width / 2 + Math.min(width * 0.36, 420);
    var originY = floorY + 14;
    addEffect('muzzle', originX, originY, gun.pellets > 1 ? 1.6 : 1, Math.atan2(pointer.y - originY, pointer.x - originX));
    for (var i = 0; i < gun.pellets; i++) {
      var angle = rand(0, Math.PI * 2);
      var miss = Math.sqrt(Math.random()) * gun.spread;
      shootAt(originX, originY, pointer.x + Math.cos(angle) * miss, pointer.y + Math.sin(angle) * miss,
        gun.damage * getBuff('weapon'), gun.force);
    }
  }

  function shootAt(ox, oy, x, y, damage, force) {
    tracers.push({ x1: ox, y1: oy, x2: x, y2: y, born: performance.now() });
    addEffect('flash', x, y, 18);
    var statue = findStatueAt(x, y);
    if (statue) {
      breakStatue(statue);
      return;
    }
    if (!checkInsideUrn(x, y, 1)) return;
    var dx = x - ox;
    var dy = y - oy;
    var length = Math.sqrt(dx * dx + dy * dy) || 1;
    burstParticles('spark', x, y, 3, 300);
    pushUrn(dx / length, dy / length, force, rand(-1, 1) * force * 0.01);
    damageUrn(damage, x, y);
  }

  // Turret rounds travel from the turret, so they are traced as a ray.
  function shootRay(ox, oy, dx, dy, damage, force) {
    var distance = castRayAtUrn(ox, oy, dx, dy);
    var blocker = findStatueOnRay(ox, oy, dx, dy, distance < 0 ? 2400 : distance);
    var reach = blocker ? blocker.reach : (distance < 0 ? 2400 : distance);
    var endX = ox + dx * reach;
    var endY = oy + dy * reach;
    tracers.push({ x1: ox, y1: oy, x2: endX, y2: endY, born: performance.now() });
    if (blocker) {
      breakStatue(blocker.statue);
      return;
    }
    if (distance < 0) return;
    burstParticles('spark', endX, endY, 3, 300);
    addEffect('flash', endX, endY, 22);
    pushUrn(dx, dy, force, rand(-1, 1) * force * 0.01);
    damageUrn(damage, endX, endY);
  }

  function placeBomb() {
    if (bombs.length >= MAX_BOMBS) return;
    var bomb = { x: pointer.x, y: Math.min(pointer.y, floorY - 14), vy: 0, born: performance.now(), stuck: null };
    if (checkInsideUrn(pointer.x, pointer.y, 1)) bomb.stuck = toUrnLocal(pointer.x, pointer.y);
    bombs.push(bomb);
  }

  function explodeBomb(bomb) {
    var reach = BOMB_RADIUS * getBuff('range');
    blasts.push({ x: bomb.x, y: bomb.y, radius: reach, born: performance.now() });
    addEffect('flash', bomb.x, bomb.y, reach * 0.9);
    burstParticles('fire', bomb.x, bomb.y, 26, 520);
    burstParticles('spark', bomb.x, bomb.y, 16, 760);
    burstParticles('smoke', bomb.x, bomb.y, 10, 160);
    statues.filter(function (statue) {
      return Math.abs(statue.x - bomb.x) < reach * 0.5 && bomb.y > floorY - reach * 0.5;
    }).forEach(breakStatue);
    if (urn.broken) return;
    var dx = urn.x - bomb.x;
    var dy = urn.y - bomb.y;
    var distance = Math.sqrt(dx * dx + dy * dy) || 1;
    if (distance > reach) return;
    var power = 1 - distance / reach;
    // A bomb stuck dead centre has no direction, so it throws him straight up.
    if (distance < 20) { dx = rand(-0.4, 0.4); dy = -1; distance = 1; }
    pushUrn(dx / distance, dy / distance, BOMB_FORCE * power, rand(-14, 14) * power);
    urn.vy -= 600 * power;
    damageUrn(BOMB_DAMAGE * power * getBuff('spirit'), bomb.x, bomb.y);
  }

  function updateBombs(now, dt) {
    for (var i = bombs.length - 1; i >= 0; i--) {
      var bomb = bombs[i];
      if (bomb.stuck) {
        var offset = fromUrnLocal(bomb.stuck.x, bomb.stuck.y);
        bomb.x = urn.x + offset.x;
        bomb.y = urn.y + offset.y;
      } else {
        bomb.vy += GRAVITY * dt;
        bomb.y += bomb.vy * dt;
        if (bomb.y > floorY - 14) { bomb.y = floorY - 14; bomb.vy *= -0.3; }
      }
      if (now - bomb.born > BOMB_FUSE_MS) {
        bombs.splice(i, 1);
        explodeBomb(bomb);
      }
    }
  }

  function throwHook() {
    var dx = pointer.x - urn.x;
    var dy = pointer.y - urn.y;
    var distance = Math.sqrt(dx * dx + dy * dy);
    hookLine = { x: pointer.x, y: pointer.y, born: performance.now() };
    if (urn.broken || distance < 60) return;
    urn.grabbed = false;
    urn.vx = dx / distance * HOOK_SPEED;
    urn.vy = dy / distance * HOOK_SPEED - 300;
    urn.va += rand(-6, 6);
    damageUrn(HOOK_DAMAGE * getBuff('spirit'), urn.x, urn.y);
  }

  function puddlePunch() {
    gooFist = { x: pointer.x, born: performance.now() };
    burstParticles('goo', pointer.x, floorY - 10, 14, 520);
    statues.filter(function (statue) { return Math.abs(statue.x - pointer.x) < 80; }).forEach(breakStatue);
    if (urn.broken) return;
    var extents = getUrnExtents();
    var bottom = urn.y + extents.y;
    if (Math.abs(urn.x - pointer.x) > extents.x + 50 || bottom < floorY - PUDDLE_REACH) return;
    urn.grabbed = false;
    urn.vy = -PUDDLE_LAUNCH;
    urn.vx += (urn.x - pointer.x) * 5;
    urn.va += rand(-8, 8);
    damageUrn(PUDDLE_DAMAGE * getBuff('spirit'), urn.x, bottom);
  }

  function addParticle(kind, x, y, vx, vy, life, size) {
    if (particles.length >= MAX_PARTICLES) return;
    particles.push({ kind: kind, x: x, y: y, vx: vx, vy: vy, born: performance.now(), life: life, size: size });
  }

  function burstParticles(kind, x, y, count, speed) {
    for (var i = 0; i < count; i++) {
      var angle = rand(0, Math.PI * 2);
      var velocity = rand(0.3, 1) * speed;
      addParticle(kind, x, y, Math.cos(angle) * velocity, Math.sin(angle) * velocity - speed * 0.25, rand(300, 700), rand(8, 20));
    }
  }

  function addEffect(type, x, y, scale, angle) {
    effects.push({ type: type, x: x, y: y, scale: scale, angle: angle || 0, born: performance.now() });
  }

  function sprayFire(now) {
    var dx = urn.x - pointer.x;
    var dy = urn.y - pointer.y;
    var distance = Math.sqrt(dx * dx + dy * dy) || 1;
    for (var i = 0; i < 3; i++) {
      addParticle('fire', pointer.x, pointer.y,
        dx / distance * 520 + rand(-130, 130), dy / distance * 520 + rand(-130, 130), rand(280, 560), rand(10, 20));
    }
    if (Math.random() < 0.2) addParticle('smoke', pointer.x, pointer.y, dx / distance * 200, dy / distance * 200 - 60, 700, 12);
    if (!urn.broken && distance < urn.h * FLAME_REACH * getBuff('range')) burnUntil = now + BURN_MS;
  }

  function updateBurn(now, dt) {
    if (urn.broken || now > burnUntil) return;
    var spot = fromUrnLocal(rand(-urn.w / 3, urn.w / 3), rand(-urn.h / 2.2, urn.h / 2.4));
    addParticle('fire', urn.x + spot.x, urn.y + spot.y, rand(-40, 40), rand(-200, -80), rand(300, 600), rand(8, 16));
    if (Math.random() < 0.3) addParticle('ember', urn.x + spot.x, urn.y + spot.y, rand(-60, 60), rand(-260, -120), rand(600, 1100), rand(4, 7));
    damageUrn(BURN_DAMAGE_PER_SEC * getBuff('spirit') * dt, urn.x + spot.x, urn.y + spot.y);
    // Hot floor: he hops around while he is on fire.
    if (urn.onFloor && Math.random() < 3 * dt) {
      urn.vy = -520;
      urn.vx += rand(-260, 260);
    }
  }

  function updateParticles(now, dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      var kind = PARTICLE_KINDS[p.kind];
      var drag = 1 - Math.min(1, kind.drag * dt);
      p.vy += kind.gravity * dt;
      p.vx *= drag;
      p.vy *= drag;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (kind.gravity > 0 && p.y > floorY - 3) {
        p.y = floorY - 3;
        p.vy *= -0.3;
        p.vx *= 0.6;
      }
      if (now - p.born > p.life) particles.splice(i, 1);
    }
  }

  function updateVortex(dt) {
    // Motes spiral into the core from all around it.
    for (var i = 0; i < 2; i++) {
      var angle = rand(0, Math.PI * 2);
      var radius = rand(90, 190);
      addParticle('pull', pointer.x + Math.cos(angle) * radius, pointer.y + Math.sin(angle) * radius,
        -Math.cos(angle) * radius * 2.4 - Math.sin(angle) * 160, -Math.sin(angle) * radius * 2.4 + Math.cos(angle) * 160, 380, 10);
    }
    var dx = pointer.x - urn.x;
    var dy = pointer.y - urn.y;
    var distance = Math.sqrt(dx * dx + dy * dy) || 1;
    var reach = VORTEX_RADIUS * getBuff('range');
    if (urn.broken || distance > reach) return;
    urn.grabbed = false;
    urn.descending = false;
    var pull = VORTEX_PULL * (1 - distance / reach) + 800;
    urn.vx += dx / distance * pull * dt;
    urn.vy += dy / distance * pull * dt - GRAVITY * 0.9 * dt;
    urn.vx *= 1 - Math.min(1, 1.5 * dt);
    urn.vy *= 1 - Math.min(1, 1.5 * dt);
    urn.va += 14 * dt;
    if (distance < VORTEX_CORE) damageUrn(VORTEX_DAMAGE_PER_SEC * getBuff('spirit') * dt, urn.x + rand(-20, 20), urn.y + rand(-40, 40));
  }

  function toggleTurret() {
    for (var i = 0; i < turrets.length; i++) {
      if (Math.abs(turrets[i].x - pointer.x) < 32 && pointer.y > floorY - 70) {
        turrets.splice(i, 1);
        return;
      }
    }
    if (turrets.length >= MAX_TURRETS) {
      addText(pointer.x, pointer.y, 'Max ' + MAX_TURRETS + ' turrets', '#ff6b5e');
      return;
    }
    turrets.push({ x: clamp(pointer.x, 30, width - 30), lastShot: performance.now() });
  }

  function updateTurrets(now) {
    turrets.forEach(function (turret) {
      if (urn.broken || now - turret.lastShot < TURRET_INTERVAL_MS / getBuff('fireRate')) return;
      turret.lastShot = now;
      var originY = floorY - 30;
      var dx = urn.x + rand(-urn.w / 4, urn.w / 4) - turret.x;
      var dy = urn.y + rand(-urn.h / 4, urn.h / 4) - originY;
      var length = Math.sqrt(dx * dx + dy * dy) || 1;
      addEffect('muzzle', turret.x + dx / length * 34, originY + dy / length * 34, 0.8, Math.atan2(dy, dx));
      shootRay(turret.x, originY, dx / length, dy / length, TURRET_DAMAGE * getBuff('weapon'), 90);
    });
  }

  function slamUrn() {
    if (urn.broken) return;
    addEffect('impact', urn.x, urn.y - urn.h / 2, 1.4);
    if (urn.onFloor) {
      damageUrn(SLAM_FLOOR_DAMAGE * getBuff('spirit'), urn.x, floorY);
      return;
    }
    urn.grabbed = false;
    urn.descending = false;
    urn.vx *= 0.3;
    urn.vy = SLAM_SPEED;
  }

  function chargeUrn() {
    if (urn.broken) return;
    var side = urn.x >= pointer.x ? 1 : -1;
    urn.grabbed = false;
    urn.vx = side * CHARGE_SPEED;
    urn.vy = -350;
    urn.va += side * 8;
    addEffect('impact', urn.x - side * urn.w / 2, urn.y, 1.5);
    damageUrn(CHARGE_DAMAGE * getBuff('spirit'), urn.x - side * urn.w / 2, urn.y);
  }

  function leapUrn() {
    if (urn.broken) return;
    urn.grabbed = false;
    urn.vy = -LEAP_SPEED;
    urn.vx += rand(-300, 300);
    urn.va += rand(-4, 4);
    burstParticles('gold', urn.x, urn.y + urn.h / 2, 12, 360);
    damageUrn(2, urn.x, urn.y + urn.h / 2);
  }

  function markKnockdown() {
    if (knockdownAt || !checkInsideUrn(pointer.x, pointer.y, GRAB_PAD)) return;
    knockdownAt = performance.now() + KNOCKDOWN_DELAY_MS;
  }

  function updateKnockdown(now) {
    if (!knockdownAt || now < knockdownAt) return;
    knockdownAt = 0;
    if (urn.broken) return;
    tracers.push({ x1: urn.x, y1: 0, x2: urn.x, y2: urn.y, born: now });
    addEffect('flash', urn.x, urn.y, urn.h);
    burstParticles('spark', urn.x, urn.y, 14, 600);
    urn.grabbed = false;
    urn.vy = 1800;
    urn.va += rand(-10, 10);
    damageUrn(KNOCKDOWN_DAMAGE * getBuff('weapon'), urn.x, urn.y - urn.h / 2);
  }

  function updateSiphon(now, dt) {
    var dx = pointer.x - urn.x;
    var dy = pointer.y - urn.y;
    var distance = Math.sqrt(dx * dx + dy * dy) || 1;
    siphoning = !urn.broken && distance < SIPHON_REACH * getBuff('range');
    if (!siphoning) return;
    damageUrn(SIPHON_DAMAGE_PER_SEC * getBuff('spirit') * dt, urn.x, urn.y);
    if (now - lastSiphonSoulAt < SIPHON_SOUL_MS || souls.length >= MAX_SOULS) return;
    lastSiphonSoulAt = now;
    spawnSoul(urn.x, urn.y);
    var soul = souls[souls.length - 1];
    soul.vx = dx / distance * 700;
    soul.vy = dy / distance * 700;
  }

  function rollBall() {
    if (balls.length >= MAX_BALLS) return;
    var fromLeft = pointer.x > width / 2;
    balls.push({
      x: fromLeft ? -30 : width + 30, y: clamp(pointer.y, 40, floorY - 30),
      vx: (fromLeft ? 1 : -1) * BALL_SPEED, lastZap: 0, zapUntil: 0
    });
  }

  function updateBalls(now, dt) {
    var reach = BALL_REACH * getBuff('range');
    for (var i = balls.length - 1; i >= 0; i--) {
      var ball = balls[i];
      ball.x += ball.vx * dt;
      if (ball.x < -60 || ball.x > width + 60) {
        balls.splice(i, 1);
        continue;
      }
      var dx = urn.x - ball.x;
      var dy = urn.y - ball.y;
      if (urn.broken || dx * dx + dy * dy > reach * reach || now - ball.lastZap < BALL_ZAP_MS) continue;
      ball.lastZap = now;
      ball.zapUntil = now + 90;
      urn.vx += rand(-120, 120);
      urn.vy -= 60;
      damageUrn(BALL_DAMAGE * getBuff('spirit'), urn.x + rand(-20, 20), urn.y + rand(-40, 40));
    }
  }

  function updateGoose(now, dt) {
    if (!owned.goose) return;
    if (!nextGooseBuffAt) nextGooseBuffAt = now + GOOSE_BUFF_MS;
    gooseSouls += GOOSE_SOULS_PER_SEC * dt;
    if (gooseSouls >= GOOSE_PAYOUT) {
      gooseSouls -= GOOSE_PAYOUT;
      addScore(GOOSE_PAYOUT);
    }
    if (now > nextGooseBuffAt) {
      nextGooseBuffAt = now + GOOSE_BUFF_MS;
      spawnTome(urn.x, urn.y - urn.h / 2, rand(-200, 200), -600);
    }
  }

  function updateHeldWeapons(now, dt) {
    siphoning = false;
    if (!pointer.down) return;
    if (tool === 'smg') fireGun(SMG, now);
    else if (tool === 'fire') sprayFire(now);
    else if (tool === 'vortex') updateVortex(dt);
    else if (tool === 'siphon') updateSiphon(now, dt);
  }

  // ---- Ability bar and shop ----

  function getEntry(id) {
    return SHOP_ENTRIES.filter(function (entry) { return entry.id === id; })[0];
  }

  function formatSouls(amount) {
    return amount.toLocaleString('en-US');
  }

  function openShop() { shop.classList.add('open'); }
  function closeShop() { shop.classList.remove('open'); }

  function recalcItems() {
    itemBonus = {};
    ITEMS.forEach(function (item) {
      if (!owned[item.id]) return;
      Object.keys(item.mods).forEach(function (stat) { itemBonus[stat] = (itemBonus[stat] || 0) + item.mods[stat]; });
    });
  }

  function selectTool(id) {
    if (!owned[id]) {
      openShop();
      return;
    }
    tool = id;
    charge = null;
    releaseUrn();
    refreshTools();
  }

  // Number keys pick from the abilities owned so far, in bar order.
  function selectSlot(index) {
    var mine = TOOLS.filter(function (def) { return owned[def.id]; });
    if (mine[index]) selectTool(mine[index].id);
  }

  function buyEntry(id) {
    var entry = getEntry(id);
    if (!owned[id]) {
      if (score < entry.cost) {
        var row = shopRows[id];
        row.classList.remove('nope');
        void row.offsetWidth;
        row.classList.add('nope');
        return;
      }
      owned[id] = true;
      addScore(-entry.cost);
      recalcItems();
    }
    if (entry.mods) {
      refreshTools();
      return;
    }
    closeShop();
    selectTool(id);
    // A new ability can wrap the bar onto another row, which moves the floor.
    resize();
  }

  function refreshTools() {
    var slot = 0;
    TOOLS.forEach(function (def) {
      var button = toolButtons[def.id];
      var key = button.querySelector('.key');
      button.classList.toggle('selected', tool === def.id);
      button.classList.toggle('locked', !owned[def.id]);
      if (!owned[def.id]) return;
      slot++;
      key.textContent = slot % 10;
      key.style.visibility = slot <= 10 ? 'visible' : 'hidden';
    });
    SHOP_ENTRIES.forEach(function (entry) {
      var row = shopRows[entry.id];
      var locked = !owned[entry.id];
      row.classList.toggle('poor', locked && score < entry.cost);
      row.querySelector('.state').textContent = locked ? '' : 'OWNED';
      row.querySelector('.price').style.display = locked ? 'flex' : 'none';
    });
  }

  function addShopHeading(text) {
    var heading = document.createElement('div');
    heading.className = 'shopHead';
    heading.textContent = text;
    shopList.appendChild(heading);
  }

  function addShopRow(entry) {
    var row = document.createElement('button');
    row.type = 'button';
    row.className = 'row ' + entry.kind;
    row.dataset.tip = entry.name + '|' + entry.hint;
    row.innerHTML = '<img class="icon" src="' + IMG_DIR + entry.icon + '" alt="">' +
      '<span class="info"><span>' + entry.name + '</span>' +
      '<span class="price"><img src="' + IMG_DIR + 'Souls_icon.png" alt="">' + formatSouls(entry.cost) + '</span></span>' +
      '<span class="state"></span>';
    row.addEventListener('click', function () { buyEntry(entry.id); });
    shopList.appendChild(row);
    shopRows[entry.id] = row;
  }

  function buildToolbar() {
    addShopHeading('WEAPONS AND ABILITIES');
    TOOLS.forEach(function (def) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'tool';
      button.dataset.tip = def.name + '|' + def.hint;
      button.innerHTML = '<span class="disc"><img class="icon" src="' + IMG_DIR + def.icon + '" alt=""></span><span class="key"></span>';
      button.addEventListener('click', function () { selectTool(def.id); });
      toolbar.appendChild(button);
      toolButtons[def.id] = button;
      addShopRow(def);
    });
    addShopHeading('ITEMS');
    ITEMS.forEach(addShopRow);
    refreshTools();
  }

  // ---- Drawing ----

  function strokeLine(x1, y1, x2, y2) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function drawGlow(sprite, x, y, radius) {
    ctx.drawImage(sprite, x - radius, y - radius, radius * 2, radius * 2);
  }

  function drawTurret(turret) {
    var originY = floorY - 30;
    var angle = Math.atan2(urn.y - originY, urn.x - turret.x);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#2b2f2c';
    ctx.lineWidth = 5;
    strokeLine(turret.x, originY + 6, turret.x - 20, floorY);
    strokeLine(turret.x, originY + 6, turret.x + 20, floorY);
    strokeLine(turret.x, originY + 6, turret.x, floorY);
    ctx.save();
    ctx.translate(turret.x, originY);
    ctx.rotate(angle);
    ctx.fillStyle = '#1f2321';
    ctx.fillRect(6, -4, 30, 8);
    ctx.fillStyle = '#e9982f';
    ctx.fillRect(30, -5, 6, 10);
    ctx.fillStyle = '#4a564f';
    ctx.strokeStyle = '#20241f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(glows.teal, turret.x, originY, 10);
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineWidth = 1;
    ctx.lineCap = 'butt';
  }

  function drawGooFist(now) {
    var t = (now - gooFist.born) / 360;
    if (t >= 1) { gooFist = null; return; }
    var x = gooFist.x;
    var top = floorY - Math.sin(Math.PI * Math.max(0, t)) * PUDDLE_REACH;
    ctx.fillStyle = 'rgba(70, 130, 60, 0.8)';
    ctx.beginPath();
    ctx.ellipse(x, floorY, 80, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    var goo = ctx.createLinearGradient(0, top - 36, 0, floorY);
    goo.addColorStop(0, '#d6f58a');
    goo.addColorStop(0.4, '#8fd45a');
    goo.addColorStop(1, '#3d7a3a');
    ctx.fillStyle = goo;
    ctx.beginPath();
    ctx.moveTo(x - 62, floorY);
    ctx.quadraticCurveTo(x - 30, floorY - (floorY - top) * 0.4, x - 36, top);
    ctx.arc(x, top, 36, Math.PI, 0);
    ctx.quadraticCurveTo(x + 30, floorY - (floorY - top) * 0.4, x + 62, floorY);
    ctx.fill();
    ctx.strokeStyle = 'rgba(40, 90, 40, 0.7)';
    ctx.lineWidth = 3;
    for (var knuckle = -1; knuckle <= 1; knuckle++) {
      ctx.beginPath();
      ctx.arc(x + knuckle * 20, top - 6, 11, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
    }
    ctx.lineWidth = 1;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.beginPath();
    ctx.ellipse(x - 14, top - 16, 9, 5, -0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawVortex(now) {
    var x = pointer.x;
    var y = pointer.y;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.55;
    drawGlow(glows.blue, x, y, 150);
    ctx.globalAlpha = 1;
    ctx.lineCap = 'round';
    for (var arm = 0; arm < 4; arm++) {
      for (var step = 0; step < 3; step++) {
        var start = now / 220 + arm * Math.PI / 2 + step * 0.5;
        ctx.strokeStyle = 'rgba(150, 215, 255, ' + (0.8 - step * 0.22) + ')';
        ctx.lineWidth = 5 - step * 1.3;
        ctx.beginPath();
        ctx.arc(x, y, 46 + step * 22, start, start + 0.9);
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    var core = ctx.createRadialGradient(x, y, 4, x, y, 40);
    core.addColorStop(0, '#02030a');
    core.addColorStop(0.75, '#050818');
    core.addColorStop(1, 'rgba(120, 200, 255, 0.9)');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(x, y, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.lineCap = 'butt';
  }

  function drawParticle(p, now) {
    var kind = PARTICLE_KINDS[p.kind];
    var age = clamp((now - p.born) / p.life, 0, 1);
    if (p.kind === 'spark') {
      ctx.globalAlpha = 1 - age;
      ctx.strokeStyle = '#ffe9a8';
      ctx.lineWidth = 2;
      strokeLine(p.x, p.y, p.x - p.vx * 0.035, p.y - p.vy * 0.035);
      return;
    }
    // Fire cools from yellow through orange to red as it rises.
    var sprite = p.kind === 'fire' ? (age < 0.25 ? glows.yellow : (age < 0.6 ? glows.orange : glows.red)) : glows[kind.glow];
    ctx.globalAlpha = (1 - age) * kind.alpha;
    drawGlow(sprite, p.x, p.y, p.size * Math.max(0.1, kind.scale + kind.grow * age));
  }

  function drawParticles(now) {
    [false, true].forEach(function (additive) {
      ctx.globalCompositeOperation = additive ? 'lighter' : 'source-over';
      particles.forEach(function (p) {
        if (PARTICLE_KINDS[p.kind].additive === additive) drawParticle(p, now);
      });
    });
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
  }

  function drawBomb(bomb, now) {
    var fuse = clamp((now - bomb.born) / BOMB_FUSE_MS, 0, 1);
    // The light blinks faster as the fuse runs down.
    var pulse = 0.5 + 0.5 * Math.sin(fuse * fuse * 60);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5 + 0.4 * pulse;
    drawGlow(glows.red, bomb.x, bomb.y, 34 + 16 * pulse);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#2a2623';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    for (var spike = 0; spike < 6; spike++) {
      var angle = spike * Math.PI / 3;
      strokeLine(bomb.x + Math.cos(angle) * 10, bomb.y + Math.sin(angle) * 10, bomb.x + Math.cos(angle) * 19, bomb.y + Math.sin(angle) * 19);
    }
    var shell = ctx.createRadialGradient(bomb.x - 4, bomb.y - 5, 1, bomb.x, bomb.y, 14);
    shell.addColorStop(0, '#7a6f66');
    shell.addColorStop(1, '#1f1b19');
    ctx.fillStyle = shell;
    ctx.beginPath();
    ctx.arc(bomb.x, bomb.y, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = pulse > 0.5 ? '#ffd27a' : '#ff5a36';
    ctx.beginPath();
    ctx.arc(bomb.x, bomb.y, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.lineCap = 'butt';
  }

  // Each tracer is a streak that shortens toward the impact point as it fades.
  function drawTracers(now) {
    ctx.lineCap = 'round';
    for (var i = tracers.length - 1; i >= 0; i--) {
      var tracer = tracers[i];
      var t = Math.max(0, (now - tracer.born) / 110);
      if (t >= 1) { tracers.splice(i, 1); continue; }
      var tailX = tracer.x1 + (tracer.x2 - tracer.x1) * t;
      var tailY = tracer.y1 + (tracer.y2 - tracer.y1) * t;
      var streak = ctx.createLinearGradient(tailX, tailY, tracer.x2, tracer.y2);
      streak.addColorStop(0, 'rgba(255, 170, 60, 0)');
      streak.addColorStop(1, 'rgba(255, 236, 170, ' + (1 - t) + ')');
      ctx.strokeStyle = streak;
      ctx.lineWidth = 5;
      strokeLine(tailX, tailY, tracer.x2, tracer.y2);
      ctx.strokeStyle = 'rgba(255, 255, 255, ' + (1 - t) + ')';
      ctx.lineWidth = 1.5;
      strokeLine((tailX + tracer.x2) / 2, (tailY + tracer.y2) / 2, tracer.x2, tracer.y2);
    }
    ctx.lineWidth = 1;
    ctx.lineCap = 'butt';
  }

  function drawBalls(now) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = '#d8f2ff';
    ctx.lineWidth = 2.5;
    balls.forEach(function (ball) {
      drawGlow(glows.blue, ball.x, ball.y, 46);
      drawGlow(glows.white, ball.x, ball.y, 16 + 3 * Math.sin(now / 60));
      if (urn.broken || now > ball.zapUntil) return;
      // A fresh jagged bolt every frame while it zaps.
      ctx.beginPath();
      ctx.moveTo(ball.x, ball.y);
      for (var step = 1; step < 6; step++) {
        ctx.lineTo(ball.x + (urn.x - ball.x) * step / 6 + rand(-14, 14), ball.y + (urn.y - ball.y) * step / 6 + rand(-14, 14));
      }
      ctx.lineTo(urn.x, urn.y);
      ctx.stroke();
    });
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineWidth = 1;
  }

  // A marker drops toward him while the knockdown counts down.
  function drawKnockdown(now) {
    if (!knockdownAt || urn.broken) return;
    var left = clamp((knockdownAt - now) / KNOCKDOWN_DELAY_MS, 0, 1);
    var y = urn.y - urn.h / 2 - 24 - left * 60;
    ctx.fillStyle = '#e9982f';
    ctx.beginPath();
    ctx.moveTo(urn.x - 12, y - 16);
    ctx.lineTo(urn.x + 12, y - 16);
    ctx.lineTo(urn.x, y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(233, 152, 47, ' + (1 - left * 0.6) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(urn.x, urn.y, urn.h * 0.5 + left * 60, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  // Two strands of soul-light twisting from him to the cursor.
  function drawSiphon(now) {
    if (!siphoning) return;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(125, 255, 208, 0.8)';
    ctx.lineWidth = 3;
    [0, Math.PI].forEach(function (phase) {
      ctx.beginPath();
      for (var step = 0; step <= 20; step++) {
        var along = step / 20;
        var sway = Math.sin(along * 10 - now / 90 + phase) * 8 * Math.sin(Math.PI * along);
        var x = urn.x + (pointer.x - urn.x) * along + sway;
        var y = urn.y + (pointer.y - urn.y) * along + sway;
        if (step === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    });
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineWidth = 1;
  }

  // A chain from the cursor with a claw clamped on him.
  function drawHook(now) {
    if (!hookLine) return;
    if (urn.broken || now - hookLine.born > 260) { hookLine = null; return; }
    ctx.lineCap = 'round';
    ctx.setLineDash([12, 7]);
    ctx.strokeStyle = '#2a2623';
    ctx.lineWidth = 8;
    strokeLine(hookLine.x, hookLine.y, urn.x, urn.y);
    ctx.strokeStyle = '#c9c2b4';
    ctx.lineWidth = 4;
    strokeLine(hookLine.x, hookLine.y, urn.x, urn.y);
    ctx.setLineDash([]);
    ctx.save();
    ctx.translate(urn.x, urn.y);
    ctx.rotate(Math.atan2(urn.y - hookLine.y, urn.x - hookLine.x));
    ctx.strokeStyle = '#e9982f';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(0, 0, 22, -1.2, 1.2);
    ctx.stroke();
    ctx.restore();
    ctx.lineWidth = 1;
    ctx.lineCap = 'butt';
  }

  function drawEffects(now) {
    for (var i = effects.length - 1; i >= 0; i--) {
      var fx = effects[i];
      var t = Math.max(0, (now - fx.born) / EFFECT_LIFE_MS[fx.type]);
      if (t >= 1) { effects.splice(i, 1); continue; }
      ctx.globalAlpha = 1 - t;
      if (fx.type === 'flash') {
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(glows.white, fx.x, fx.y, fx.scale * (0.6 + 0.6 * t));
      } else if (fx.type === 'muzzle') {
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(glows.yellow, fx.x, fx.y, 46 * fx.scale);
        ctx.save();
        ctx.translate(fx.x, fx.y);
        ctx.rotate(fx.angle);
        ctx.fillStyle = '#fff0c8';
        ctx.beginPath();
        ctx.moveTo(0, -7 * fx.scale);
        ctx.lineTo(60 * fx.scale * (1 - t * 0.5), 0);
        ctx.lineTo(0, 7 * fx.scale);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      } else {
        // Melee and smash hits: a starburst with a ring racing outward.
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = '#fff4d6';
        ctx.lineCap = 'round';
        ctx.lineWidth = 5 * (1 - t) * fx.scale + 0.5;
        for (var spike = 0; spike < 8; spike++) {
          var angle = spike * Math.PI / 4 + fx.born % 1;
          strokeLine(
            fx.x + Math.cos(angle) * (10 + 26 * t) * fx.scale, fx.y + Math.sin(angle) * (10 + 26 * t) * fx.scale,
            fx.x + Math.cos(angle) * (22 + 52 * t) * fx.scale, fx.y + Math.sin(angle) * (22 + 52 * t) * fx.scale);
        }
        ctx.lineWidth = 3 * (1 - t) + 0.5;
        ctx.beginPath();
        ctx.arc(fx.x, fx.y, (18 + 40 * t) * fx.scale, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
    ctx.lineCap = 'butt';
  }

  function drawStatue(statue) {
    var size = STATUE_HEIGHT * 1.5;
    ctx.drawImage(statueImg, statue.x - size / 2, floorY - size * 0.87, size, size);
  }

  function drawTome(tome, now) {
    var bob = Math.sin(now / 300 + tome.sway) * 4;
    var glow = ctx.createRadialGradient(tome.x, tome.y, 0, tome.x, tome.y, TOME_SIZE);
    glow.addColorStop(0, 'rgba(232, 196, 106, 0.5)');
    glow.addColorStop(1, 'rgba(232, 196, 106, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(tome.x - TOME_SIZE, tome.y - TOME_SIZE, TOME_SIZE * 2, TOME_SIZE * 2);
    ctx.drawImage(tomeImgs[tome.buff.id], tome.x - TOME_SIZE / 2, tome.y - TOME_SIZE / 2 + bob, TOME_SIZE, TOME_SIZE);
  }

  function drawBag() {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.6;
    drawGlow(glows.teal, bag.x, bag.y, BAG_RADIUS * 2.4);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.translate(bag.x, bag.y);
    // It rolls with its travel along the floor.
    ctx.rotate(bag.x / BAG_RADIUS);
    ctx.drawImage(bagSprite, -BAG_RADIUS, -BAG_RADIUS, BAG_RADIUS * 2, BAG_RADIUS * 2);
    ctx.restore();
    ctx.fillStyle = '#7dffd0';
    ctx.font = 'bold 15px Trebuchet MS, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(formatSouls(bag.value), bag.x, bag.y - BAG_RADIUS - 10);
  }

  // Each shard is the urn image clipped to one cell of the fracture grid.
  function drawShards(now) {
    shards.forEach(function (shard) {
      var shape = shard.shape;
      ctx.save();
      ctx.globalAlpha = clamp((SHARD_LIFE_MS - (now - shard.born)) / 600, 0, 1);
      ctx.translate(shard.x, shard.y);
      ctx.rotate(shard.a);
      ctx.beginPath();
      shape.points.forEach(function (p, i) {
        var x = (p[0] - shape.cx) * urn.w;
        var y = (p[1] - shape.cy) * urn.h;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(urnImg, -shape.cx * urn.w, -shape.cy * urn.h, urn.w, urn.h);
      ctx.restore();
    });
  }

  function strokeReticle(x, y, gap) {
    ctx.beginPath();
    ctx.moveTo(x - gap - 9, y);
    ctx.lineTo(x - gap, y);
    ctx.moveTo(x + gap, y);
    ctx.lineTo(x + gap + 9, y);
    ctx.moveTo(x, y - gap - 9);
    ctx.lineTo(x, y - gap);
    ctx.moveTo(x, y + gap);
    ctx.lineTo(x, y + gap + 9);
    ctx.stroke();
  }

  // Drawn in place of the system pointer: a crosshair that kicks open when a gun fires,
  // a ring for the hand (it tightens while he is held) and for melee.
  function drawCursor() {
    if (!pointer.inside) return;
    var x = pointer.x;
    var y = pointer.y;
    var passes = [['rgba(0, 0, 0, 0.65)', 4.5], [tool === 'hand' ? '#7dffd0' : '#f3ead2', 2]];
    ctx.lineCap = 'round';
    passes.forEach(function (pass) {
      ctx.strokeStyle = pass[0];
      ctx.fillStyle = pass[0];
      ctx.lineWidth = pass[1];
      if (tool === 'hand' || tool === 'melee') {
        ctx.beginPath();
        ctx.arc(x, y, urn.grabbed ? 7 : 13, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        strokeReticle(x, y, 6 + recoil * 9);
      }
      ctx.beginPath();
      ctx.arc(x, y, pass[1] * 0.8, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.lineWidth = 1;
    ctx.lineCap = 'butt';
  }

  function draw(now) {
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    if (shake > 0.5) ctx.translate(rand(-shake, shake), rand(-shake, shake));

    ctx.fillStyle = 'rgba(5, 12, 11, 0.6)';
    ctx.fillRect(0, floorY, width, height - floorY);
    ctx.fillStyle = 'rgba(232, 196, 106, 0.6)';
    ctx.fillRect(0, floorY, width, 2);

    statues.forEach(drawStatue);
    turrets.forEach(drawTurret);
    if (gooFist) drawGooFist(now);

    var glow = leak / MAX_LEAK;
    if (!urn.broken && glow > 0.02) {
      var gradient = ctx.createRadialGradient(urn.x, urn.y, 0, urn.x, urn.y, urn.h);
      gradient.addColorStop(0, 'rgba(125, 255, 208, ' + (0.45 * glow) + ')');
      gradient.addColorStop(1, 'rgba(125, 255, 208, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(urn.x - urn.h, urn.y - urn.h, urn.h * 2, urn.h * 2);
    }

    if (urnDirty || getDamageStage() !== renderedStage) renderUrn();
    if (!urn.broken && crackCanvas.width && !urnDirty) {
      ctx.save();
      ctx.translate(urn.x, urn.y);
      ctx.rotate(urn.a);
      ctx.drawImage(crackCanvas, -urn.w / 2, -urn.h / 2, urn.w, urn.h);
      ctx.restore();
    }
    drawShards(now);
    if (!urn.broken && now < burnUntil) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.35;
      drawGlow(glows.orange, urn.x, urn.y, urn.h * 0.7);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    tomes.forEach(function (tome) { drawTome(tome, now); });
    if (bag) drawBag();

    drawParticles(now);
    bombs.forEach(function (bomb) { drawBomb(bomb, now); });

    for (var b = blasts.length - 1; b >= 0; b--) {
      // The frame timestamp can be slightly older than a blast created during this frame.
      var t = Math.max(0, (now - blasts[b].born) / 350);
      if (t >= 1) { blasts.splice(b, 1); continue; }
      ctx.strokeStyle = 'rgba(255, 200, 120, ' + (1 - t) + ')';
      ctx.lineWidth = 14 * (1 - t);
      ctx.beginPath();
      ctx.arc(blasts[b].x, blasts[b].y, blasts[b].radius * t, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.lineWidth = 1;
    drawTracers(now);
    drawHook(now);
    drawEffects(now);
    drawBalls(now);
    drawKnockdown(now);
    drawSiphon(now);

    if (pointer.down && tool === 'vortex') drawVortex(now);

    souls.forEach(function (soul) {
      var pulse = 1 + Math.sin(now / 150 + soul.sway) * 0.08;
      var fade = clamp((soul.life - (now - soul.born)) / 1000, 0, 1);
      // A short wisp trails behind and below each orb.
      ctx.globalAlpha = fade * 0.4;
      for (var tail = 1; tail <= 3; tail++) {
        drawGlow(glows.teal, soul.x - soul.vx * 0.03 * tail, soul.y - soul.vy * 0.03 * tail + 5 * tail, 11 - 2 * tail);
      }
      ctx.globalAlpha = fade;
      ctx.drawImage(soulSprite, soul.x - 36 * pulse, soul.y - 36 * pulse, 72 * pulse, 72 * pulse);
    });
    ctx.globalAlpha = 1;

    if (charge) {
      var held = clamp((now - charge.start) / HEAVY_CHARGE_MS, 0, 1);
      ctx.strokeStyle = held >= 1 ? '#e8c46a' : 'rgba(243, 234, 210, 0.8)';
      ctx.lineWidth = held >= 1 ? 5 : 3;
      ctx.beginPath();
      ctx.arc(pointer.x, pointer.y, 26, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * held);
      ctx.stroke();
      ctx.lineWidth = 1;
    }

    ctx.font = 'bold 22px Trebuchet MS, sans-serif';
    ctx.textAlign = 'center';
    for (var i = texts.length - 1; i >= 0; i--) {
      var life = Math.max(0, (now - texts[i].born) / 800);
      if (life >= 1) { texts.splice(i, 1); continue; }
      ctx.globalAlpha = 1 - life;
      ctx.fillStyle = texts[i].color;
      ctx.fillText(texts[i].text, texts[i].x, texts[i].y - life * 50);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    drawCursor();
  }

  function tick(now) {
    var dt = Math.min(0.033, (now - lastFrame) / 1000);
    lastFrame = now;
    updateHeldWeapons(now, dt);
    updateUrn(now, dt);
    updateBombs(now, dt);
    updateTurrets(now);
    updateStatues(now);
    updateTomes(dt);
    updateBag(now, dt);
    updateShards(now, dt);
    updateBalls(now, dt);
    updateKnockdown(now);
    updateGoose(now, dt);
    updateBurn(now, dt);
    updateParticles(now, dt);
    updateLeak(dt);
    updateSouls(now, dt);
    shake *= 1 - Math.min(1, 8 * dt);
    recoil *= 1 - Math.min(1, 10 * dt);
    draw(now);
    placeBubble();
    var seconds = Math.floor((now - startedAt) / 1000);
    if (seconds !== clockSeconds) {
      clockSeconds = seconds;
      clock.textContent = Math.floor(seconds / 60) + ':' + ('0' + seconds % 60).slice(-2);
    }
    if (saveDirty && now - lastSaveAt > SAVE_INTERVAL_MS) {
      lastSaveAt = now;
      saveGame();
    }
    requestAnimationFrame(tick);
  }

  // ---- Input ----

  function trackPointer(e) {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.inside = e.target === canvas && e.pointerType !== 'touch';
  }

  function pressMelee(onUrn) {
    var statue = findStatueAt(pointer.x, pointer.y);
    if (statue) breakStatue(statue);
    else if (onUrn || checkOnBag(pointer.x, pointer.y)) charge = { start: performance.now() };
  }

  function pressRoom(e) {
    trackPointer(e);
    canvas.setPointerCapture(e.pointerId);
    var onUrn = checkInsideUrn(pointer.x, pointer.y, GRAB_PAD);
    if (e.button === 2 || tool === 'hand') {
      if (onUrn) grabUrn();
      return;
    }
    pointer.down = true;
    if (tool === 'melee') pressMelee(onUrn);
    else if (tool === 'shotgun') fireGun(SHOTGUN, performance.now());
    else if (tool === 'hook') throwHook();
    else if (tool === 'puddle') puddlePunch();
    else if (tool === 'sticky') placeBomb();
    else if (tool === 'turret') toggleTurret();
    else if (tool === 'slam') slamUrn();
    else if (tool === 'charge') chargeUrn();
    else if (tool === 'leap') leapUrn();
    else if (tool === 'knockdown') markKnockdown();
    else if (tool === 'ball') rollBall();
  }

  function releaseRoom() {
    pointer.down = false;
    releaseUrn();
    if (!charge) return;
    var heavy = performance.now() - charge.start >= HEAVY_CHARGE_MS;
    charge = null;
    if (checkOnBag(pointer.x, pointer.y)) meleeBag(heavy);
    else if (checkInsideUrn(pointer.x, pointer.y, GRAB_PAD)) punchUrn(heavy ? HEAVY_MELEE : LIGHT_MELEE);
  }

  // Two clicks instead of a confirm() popup: the first arms it, the second wipes the save.
  function pressReset() {
    if (!resetButton.classList.contains('warn')) {
      resetButton.classList.add('warn');
      resetButton.textContent = 'Wipe save?';
      resetTimer = setTimeout(function () {
        resetButton.classList.remove('warn');
        resetButton.textContent = 'Reset';
      }, 2500);
      return;
    }
    clearTimeout(resetTimer);
    try { localStorage.removeItem(SAVE_KEY); } catch (err) { /* see loadGame */ }
    location.reload();
  }

  function start() {
    started = true;
    startOverlay.remove();
    announce.play().catch(function () {});
    announce.addEventListener('ended', function () { if (trackIndex < 0) playTrack(0); });
    music.addEventListener('ended', playNextTrack);
    nextStatueAt = performance.now() + STATUE_FIRST_MS;
    lastFrame = performance.now();
    lastEventAt = lastFrame;
    startedAt = lastFrame;
    lastTouchedAt = lastFrame;
    requestAnimationFrame(tick);
    say('mix_hello', true);
  }

  window.addEventListener('resize', resize);
  canvas.addEventListener('pointerdown', pressRoom);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('pointermove', trackPointer);
  window.addEventListener('pointerup', releaseRoom);
  window.addEventListener('pointercancel', releaseRoom);
  window.addEventListener('beforeunload', function () { if (saveDirty) saveGame(); });
  window.addEventListener('keydown', function (e) {
    if (!started) return;
    if (e.key === 'b' || e.key === 'B') shop.classList.toggle('open');
    else if (e.key === 'Escape') closeShop();
    else if (e.key.length === 1 && e.key >= '0' && e.key <= '9') selectSlot((Number(e.key) + 9) % 10);
  });
  mapButton.addEventListener('click', cycleBackground);
  document.getElementById('shopButton').addEventListener('click', function () { shop.classList.toggle('open'); });
  document.getElementById('shopClose').addEventListener('click', closeShop);
  document.addEventListener('mousemove', showTip);
  trackButton.addEventListener('click', playNextTrack);
  volumeSlider.addEventListener('input', function () {
    volume = Number(volumeSlider.value);
    saveDirty = true;
    applyVolume();
  });
  resetButton.addEventListener('click', pressReset);
  startOverlay.addEventListener('click', start);
  urnImg.addEventListener('load', function () { urnDirty = true; });

  BUFFS.forEach(function (def) {
    buffSteps[def.id] = def.step;
    tomeImgs[def.id] = new Image();
    tomeImgs[def.id].src = IMG_DIR + def.tome;
  });
  urnImg.src = IMG_DIR + 'Soul_Urn_Render.png';
  statueImg.src = IMG_DIR + 'Golden_Statue_Render.png';
  loadGame();
  recalcItems();
  scoreValue.textContent = formatSouls(score);
  levelBadge.textContent = shatters;
  volumeSlider.value = volume;
  applyVolume();
  applyBackground();
  renderBuffs();
  refreshHaunted();
  buildGlows();
  buildSoulSprite();
  buildBagSprite();
  buildFracture();
  buildCracks();
  buildToolbar();
  resize();
})();
</script>
</body>
</html>
