<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Urn</title>
<link rel="icon" href="assets/img/Soul_Urn.png">
<style>
  :root {
    --bg-deep: #07110f;
    --bg-glow: #12382f;
    --soul: #7dffd0;
    --gold: #e8c46a;
    --ink: #0b1513;
    --paper: #f3ead2;
    --bad: #ff6b5e;
    --panel: rgba(7, 17, 15, 0.85);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 75%, var(--bg-glow), var(--bg-deep) 70%);
    color: var(--paper);
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
    user-select: none;
  }
  body.glitch { filter: hue-rotate(140deg) contrast(1.6) saturate(2); }

  #room { position: fixed; inset: 0; display: block; touch-action: none; }

  #hud {
    position: fixed; top: 12px; left: 16px;
    display: flex; flex-direction: column; gap: 6px; pointer-events: none;
  }
  #score {
    display: flex; align-items: center; gap: 8px;
    font-size: 26px; color: var(--soul); text-shadow: 0 0 12px var(--soul);
  }
  #score img { height: 34px; }
  #leakRow { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--gold); }
  #leakBar { width: 140px; height: 8px; border: 1px solid var(--gold); border-radius: 4px; overflow: hidden; }
  #leakFill { height: 100%; width: 0; background: var(--soul); }

  #toolbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 72px;
    display: flex; justify-content: center; align-items: center; gap: 10px;
    background: var(--panel); border-top: 1px solid var(--gold);
  }
  .tool {
    min-width: 96px; padding: 8px 12px; cursor: pointer;
    background: transparent; color: var(--paper);
    border: 1px solid var(--gold); border-radius: 6px;
    font: inherit; font-size: 16px; line-height: 1.2;
  }
  .tool small { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: var(--gold); }
  .tool small img { height: 14px; }
  .tool:hover { background: rgba(232, 196, 106, 0.15); }
  .tool.selected { background: var(--gold); color: var(--ink); }
  .tool.selected small { color: var(--ink); }
  .tool.locked { opacity: 0.55; }
  .tool.locked.affordable { opacity: 1; border-color: var(--soul); }
  .tool.nope { animation: nope 0.3s linear; border-color: var(--bad); }

  #bubble {
    position: fixed; left: 0; top: 0;
    max-width: min(380px, 80vw); width: max-content;
    background: var(--paper); color: var(--ink);
    padding: 10px 14px; border-radius: 14px;
    font-size: 18px; line-height: 1.3; text-align: center;
    opacity: 0; transition: opacity 0.15s; pointer-events: none;
  }
  #bubble.show { opacity: 1; }

  #start {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: rgba(4, 10, 9, 0.9); cursor: pointer; text-align: center; padding: 16px;
  }
  #start h1 { margin: 0; font-size: clamp(30px, 6vw, 60px); color: var(--gold); letter-spacing: 3px; }
  #start p { margin: 0; font-size: 19px; opacity: 0.85; }
  #start .go { color: var(--soul); text-shadow: 0 0 12px var(--soul); animation: bob 1.2s ease-in-out infinite; }

  @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
  @keyframes nope { 0%, 100% { translate: 0 0; } 25% { translate: -5px 0; } 75% { translate: 5px 0; } }
</style>
</head>
<body>

<canvas id="room"></canvas>

<div id="hud">
  <div id="score"><img src="assets/img/Souls_icon.png" alt="Souls"><span id="scoreValue">0</span></div>
  <div id="leakRow"><span id="leakLabel">Leak 0%</span><div id="leakBar"><div id="leakFill"></div></div></div>
</div>

<div id="bubble"></div>
<div id="toolbar"></div>

<div id="start">
  <h1>INTERACTIVE URN</h1>
  <p>Grab him. Throw him. Hit him with things. He leaks.</p>
  <p>Wave the cursor over loose souls to collect them, then spend them on worse ideas.</p>
  <p class="go">Click to begin your shift</p>
</div>

<script src="assets/lines.js"></script>
<script>
(function () {
  'use strict';

  var VOICE_DIR = 'assets/voice/';
  var URN_ASPECT = 502 / 1024;
  var HITBOX_SCALE = 0.8;
  var FLOOR_PAD = 96;

  var GRAVITY = 2200;
  var RESTITUTION = 0.45;
  var FLOOR_FRICTION = 4;
  var MAX_SPEED = 3200;
  var GRAB_STIFFNESS = 18;
  var UPRIGHT_SPRING = 40;
  var UPRIGHT_DAMPING = 6;

  var IMPACT_MIN_SPEED = 400;
  var IMPACT_SPEED_PER_DAMAGE = 80;
  var TALK_DAMAGE = 5;
  var MAX_LEAK = 40;
  var LEAK_DECAY = 2;
  var LEAK_SOULS_PER_SEC = 0.35;
  var BURST_SOULS_PER_DAMAGE = 0.6;
  var MAX_SOULS = 160;
  var SOUL_LIFE_MS = 7000;
  var SOUL_COLLECT_RADIUS = 46;
  var SOUL_RISE_SPEED = -70;

  var PUNCH_DAMAGE = 6;
  var PUNCH_FORCE = 950;
  var BRICK_DAMAGE = 8;
  var BRICK_SPEED = 1500;
  var BRICK_GRAVITY = 600;
  var BOMB_FUSE_MS = 1400;
  var BOMB_RADIUS = 440;
  var BOMB_DAMAGE = 30;
  var BOMB_FORCE = 1900;
  var MAX_BOMBS = 5;

  var IDLE_TALK_MS = 7000;
  var HELD_TALK_MS = 8000;
  var MILESTONE_SOULS = 1000;

  var BASE_RATE = 0.9;
  var GLITCH_RATES = [0.3, 0.45, 0.6, 1.5, 2.2];

  var TOOLS = [
    { id: 'hand', name: 'Hand', cost: 0 },
    { id: 'punch', name: 'Punch', cost: 0 },
    { id: 'brick', name: 'Brick', cost: 300 },
    { id: 'bomb', name: 'Bomb', cost: 1500 }
  ];

  var canvas = document.getElementById('room');
  var ctx = canvas.getContext('2d');
  var bubble = document.getElementById('bubble');
  var scoreValue = document.getElementById('scoreValue');
  var leakLabel = document.getElementById('leakLabel');
  var leakFill = document.getElementById('leakFill');
  var toolbar = document.getElementById('toolbar');
  var startOverlay = document.getElementById('start');

  var urnImg = new Image();
  urnImg.src = 'assets/img/Soul_Urn_Render.png';
  var soulImg = new Image();
  soulImg.src = 'assets/img/Souls_icon.png';

  var announce = new Audio('assets/music/Music_idol_announce.mp3');
  var music = new Audio('assets/music/Music_idol_carry_lp_141bpm.mp3');
  music.loop = true;
  music.volume = 0.45;
  // Pitch-bending via playbackRate also works when the page is opened from file://,
  // where Web Audio treats local media as cross-origin and outputs silence.
  music.preservesPitch = false;

  var width = 0;
  var height = 0;
  var floorY = 0;
  var urnPlaced = false;

  var urn = { x: 0, y: 0, vx: 0, vy: 0, a: 0, va: 0, w: 0, h: 0, grabbed: false, grabDx: 0, grabDy: 0, grabbedAt: 0 };
  var pointer = { x: -999, y: -999 };
  var souls = [];
  var bricks = [];
  var bombs = [];
  var blasts = [];
  var texts = [];

  var score = 0;
  var nextMilestone = MILESTONE_SOULS;
  var leak = 0;
  var soulDebt = 0;
  var shake = 0;
  var tool = 'hand';
  var owned = { hand: true, punch: true };
  var toolButtons = {};

  var voice = null;
  var bubbleTimer = 0;
  var lastEventAt = 0;
  var lastHeldTalkAt = 0;
  var idleTalks = 0;

  var lastFrame = 0;
  var glitchUntil = 0;
  var glitchRate = 1;
  var nextGlitchAt = 0;

  function rand(min, max) { return min + Math.random() * (max - min); }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    floorY = height - FLOOR_PAD;
    urn.h = clamp(height * 0.34, 140, 360);
    urn.w = urn.h * URN_ASPECT;
    // A background tab can load with a zero-size window, so wait for a real size.
    if (!urnPlaced && width > 0 && height > 0) {
      urnPlaced = true;
      urn.x = width / 2;
      urn.y = floorY - urn.h / 2;
    }
  }

  function toUrnLocal(x, y) {
    var dx = x - urn.x;
    var dy = y - urn.y;
    var c = Math.cos(-urn.a);
    var s = Math.sin(-urn.a);
    return { x: dx * c - dy * s, y: dx * s + dy * c };
  }

  function fromUrnLocal(lx, ly) {
    var c = Math.cos(urn.a);
    var s = Math.sin(urn.a);
    return { x: lx * c - ly * s, y: lx * s + ly * c };
  }

  function checkInsideUrn(x, y) {
    var local = toUrnLocal(x, y);
    return Math.abs(local.x) < urn.w * HITBOX_SCALE / 2 && Math.abs(local.y) < urn.h / 2;
  }

  function getUrnExtents() {
    var c = Math.abs(Math.cos(urn.a));
    var s = Math.abs(Math.sin(urn.a));
    var w = urn.w * HITBOX_SCALE;
    return { x: (c * w + s * urn.h) / 2, y: (s * w + c * urn.h) / 2 };
  }

  // ---- Voice ----

  function say(group, interrupt) {
    var speaking = voice && !voice.ended && !voice.paused;
    if (speaking && !interrupt) return;
    var options = (window.URN_LINES || []).filter(function (l) { return l.g.indexOf(group) !== -1; });
    if (!options.length) return;
    var line = pick(options);
    if (voice) voice.pause();
    voice = new Audio(VOICE_DIR + line.f);
    voice.play().catch(function () {});

    clearTimeout(bubbleTimer);
    bubble.textContent = line.t || '...';
    bubble.classList.add('show');
    voice.addEventListener('ended', function () {
      bubbleTimer = setTimeout(function () { bubble.classList.remove('show'); }, 700);
    });
  }

  function placeBubble() {
    var extents = getUrnExtents();
    var half = bubble.offsetWidth / 2;
    var x = clamp(urn.x, half + 8, width - half - 8);
    var y = Math.max(8, urn.y - extents.y - bubble.offsetHeight - 14);
    bubble.style.transform = 'translate(' + (x - half) + 'px,' + y + 'px)';
  }

  // ---- Souls ----

  function spawnSoul() {
    if (souls.length >= MAX_SOULS) return;
    var crack = fromUrnLocal(rand(-urn.w / 3, urn.w / 3), rand(-urn.h / 2.2, urn.h / 3));
    var angle = rand(0, Math.PI * 2);
    var speed = rand(120, 420);
    souls.push({
      x: urn.x + crack.x, y: urn.y + crack.y,
      vx: Math.cos(angle) * speed + urn.vx * 0.3,
      vy: Math.sin(angle) * speed - 200 + urn.vy * 0.3,
      born: performance.now(),
      sway: rand(0, 6.28),
      value: Math.round(rand(5, 15))
    });
  }

  function addText(x, y, text, color) {
    texts.push({ x: x, y: y, text: text, color: color, born: performance.now() });
  }

  function addScore(amount) {
    score += amount;
    scoreValue.textContent = score;
    refreshTools();
    if (score >= nextMilestone) {
      nextMilestone += MILESTONE_SOULS;
      say('idol_delivered', true);
    }
  }

  function updateSouls(now, dt) {
    for (var i = souls.length - 1; i >= 0; i--) {
      var soul = souls[i];
      soul.vx *= 1 - 2 * dt;
      soul.vy += (SOUL_RISE_SPEED - soul.vy) * 2 * dt;
      soul.x += (soul.vx + Math.sin(now / 400 + soul.sway) * 30) * dt;
      soul.y += soul.vy * dt;
      soul.x = clamp(soul.x, 14, width - 14);
      soul.y = Math.min(soul.y, floorY - 10);

      var dx = soul.x - pointer.x;
      var dy = soul.y - pointer.y;
      if (dx * dx + dy * dy < SOUL_COLLECT_RADIUS * SOUL_COLLECT_RADIUS) {
        addScore(soul.value);
        addText(soul.x, soul.y, '+' + soul.value, '#7dffd0');
        souls.splice(i, 1);
      } else if (now - soul.born > SOUL_LIFE_MS || soul.y < -40) {
        souls.splice(i, 1);
      }
    }
  }

  // ---- Urn ----

  function damageUrn(amount, voiceGroup) {
    leak = Math.min(MAX_LEAK, leak + amount);
    var burst = Math.round(amount * BURST_SOULS_PER_DAMAGE);
    for (var i = 0; i < burst; i++) spawnSoul();
    shake = Math.max(shake, amount);
    lastEventAt = performance.now();
    if (amount >= TALK_DAMAGE) say(voiceGroup || pick(['idol_holder_gets_stunned', 'idol_holder_takes_big_damage']), false);
  }

  function hitSurface(speed) {
    if (speed < IMPACT_MIN_SPEED) return;
    damageUrn((speed - IMPACT_MIN_SPEED) / IMPACT_SPEED_PER_DAMAGE + 1);
  }

  function releaseUrn() {
    if (!urn.grabbed) return;
    urn.grabbed = false;
    lastEventAt = performance.now();
    if (Math.abs(urn.vx) + Math.abs(urn.vy) < 300) say('idol_dropped', false);
  }

  function updateUrn(now, dt) {
    var extents;
    if (urn.grabbed) {
      urn.vx = clamp((pointer.x - urn.grabDx - urn.x) * GRAB_STIFFNESS, -MAX_SPEED, MAX_SPEED);
      urn.vy = clamp((pointer.y - urn.grabDy - urn.y) * GRAB_STIFFNESS, -MAX_SPEED, MAX_SPEED);
      urn.x += urn.vx * dt;
      urn.y += urn.vy * dt;
      // He swings from the hand: lean into the direction of travel.
      urn.a += (clamp(urn.vx * 0.0012, -1.1, 1.1) - urn.a) * Math.min(1, 10 * dt);
      urn.va = urn.vx * 0.004;
      extents = getUrnExtents();
      urn.x = clamp(urn.x, extents.x, width - extents.x);
      urn.y = clamp(urn.y, extents.y, floorY - extents.y);
      if (now - Math.max(urn.grabbedAt, lastHeldTalkAt) > HELD_TALK_MS) {
        lastHeldTalkAt = now;
        say('holder_stalls', false);
      }
      return;
    }

    urn.vy += GRAVITY * dt;
    urn.x += urn.vx * dt;
    urn.y += urn.vy * dt;
    urn.a += urn.va * dt;
    extents = getUrnExtents();

    if (urn.y + extents.y > floorY) {
      urn.y = floorY - extents.y;
      if (urn.vy > 0) {
        hitSurface(urn.vy);
        urn.va += urn.vx * 0.004;
        urn.vy = urn.vy > 160 ? -urn.vy * RESTITUTION : 0;
      }
      urn.vx *= 1 - Math.min(1, FLOOR_FRICTION * dt);
      // Settle onto the nearest flat side so he ends up standing or lying down.
      var flat = Math.round(urn.a / (Math.PI / 2)) * (Math.PI / 2);
      urn.va += (flat - urn.a) * UPRIGHT_SPRING * dt;
      urn.va *= 1 - Math.min(1, UPRIGHT_DAMPING * dt);
    }
    if (urn.y - extents.y < 0) {
      urn.y = extents.y;
      if (urn.vy < 0) { hitSurface(-urn.vy); urn.vy = -urn.vy * RESTITUTION; }
    }
    if (urn.x - extents.x < 0) {
      urn.x = extents.x;
      if (urn.vx < 0) { hitSurface(-urn.vx); urn.vx = -urn.vx * RESTITUTION; urn.va += urn.vy * 0.003; }
    }
    if (urn.x + extents.x > width) {
      urn.x = width - extents.x;
      if (urn.vx > 0) { hitSurface(urn.vx); urn.vx = -urn.vx * RESTITUTION; urn.va -= urn.vy * 0.003; }
    }

    if (now - lastEventAt > IDLE_TALK_MS) {
      lastEventAt = now;
      idleTalks++;
      say(idleTalks % 4 === 0 ? 'koth_warning' : 'idol_waiting', false);
    }
  }

  function updateLeak(dt) {
    leak = Math.max(0, leak - LEAK_DECAY * dt);
    soulDebt += leak * LEAK_SOULS_PER_SEC * dt;
    while (soulDebt >= 1) { soulDebt--; spawnSoul(); }
    var percent = Math.round(leak / MAX_LEAK * 100);
    leakLabel.textContent = 'Leak ' + percent + '%';
    leakFill.style.width = percent + '%';
  }

  // ---- Tools ----

  function punchUrn(x, y) {
    var dx = urn.x - x;
    var dy = urn.y - y;
    var length = Math.sqrt(dx * dx + dy * dy) || 1;
    urn.vx += dx / length * PUNCH_FORCE;
    urn.vy += dy / length * PUNCH_FORCE - 350;
    urn.va += rand(-9, 9);
    addText(x, y, 'POW', '#e8c46a');
    damageUrn(PUNCH_DAMAGE);
  }

  function throwBrick(x, y) {
    // Thrown from the wall farther from him so there is room to aim.
    var startX = urn.x < width / 2 ? width + 20 : -20;
    var startY = floorY * 0.4;
    var dx = x - startX;
    var dy = y - startY;
    var length = Math.sqrt(dx * dx + dy * dy) || 1;
    bricks.push({
      x: startX, y: startY,
      vx: dx / length * BRICK_SPEED, vy: dy / length * BRICK_SPEED,
      a: 0, va: rand(-12, 12), spent: false, born: performance.now()
    });
  }

  function updateBricks(now, dt) {
    for (var i = bricks.length - 1; i >= 0; i--) {
      var brick = bricks[i];
      brick.vy += BRICK_GRAVITY * dt;
      brick.x += brick.vx * dt;
      brick.y += brick.vy * dt;
      brick.a += brick.va * dt;
      if (!brick.spent && checkInsideUrn(brick.x, brick.y)) {
        brick.spent = true;
        urn.grabbed = false;
        urn.vx += brick.vx * 0.55;
        urn.vy += brick.vy * 0.55 - 200;
        urn.va += rand(-10, 10);
        brick.vx *= -0.3;
        brick.vy = -300;
        damageUrn(BRICK_DAMAGE);
      }
      if (brick.y > floorY - 8 && brick.vy > 0) {
        brick.y = floorY - 8;
        brick.vy *= -0.4;
        brick.vx *= 0.6;
        brick.spent = true;
      }
      if (now - brick.born > 3500) bricks.splice(i, 1);
    }
  }

  function placeBomb(x, y) {
    if (bombs.length >= MAX_BOMBS) return;
    bombs.push({ x: x, y: Math.min(y, floorY - 14), vy: 0, born: performance.now() });
  }

  function explodeBomb(bomb) {
    blasts.push({ x: bomb.x, y: bomb.y, born: performance.now() });
    shake = Math.max(shake, 18);
    var dx = urn.x - bomb.x;
    var dy = urn.y - bomb.y;
    var distance = Math.sqrt(dx * dx + dy * dy) || 1;
    if (distance > BOMB_RADIUS) return;
    var power = 1 - distance / BOMB_RADIUS;
    urn.grabbed = false;
    urn.vx += dx / distance * BOMB_FORCE * power;
    urn.vy += dy / distance * BOMB_FORCE * power - 600 * power;
    urn.va += rand(-14, 14) * power;
    damageUrn(BOMB_DAMAGE * power, power > 0.5 ? 'koth_give_up' : null);
  }

  function updateBombs(now, dt) {
    for (var i = bombs.length - 1; i >= 0; i--) {
      var bomb = bombs[i];
      bomb.vy += GRAVITY * dt;
      bomb.y += bomb.vy * dt;
      if (bomb.y > floorY - 14) { bomb.y = floorY - 14; bomb.vy *= -0.3; }
      if (now - bomb.born > BOMB_FUSE_MS) {
        bombs.splice(i, 1);
        explodeBomb(bomb);
      }
    }
  }

  function selectTool(id) {
    var def = TOOLS.filter(function (t) { return t.id === id; })[0];
    if (!owned[id]) {
      if (score < def.cost) {
        var button = toolButtons[id];
        button.classList.remove('nope');
        void button.offsetWidth;
        button.classList.add('nope');
        return;
      }
      owned[id] = true;
      addScore(-def.cost);
    }
    tool = id;
    releaseUrn();
    refreshTools();
  }

  function refreshTools() {
    TOOLS.forEach(function (def) {
      var button = toolButtons[def.id];
      var locked = !owned[def.id];
      button.classList.toggle('selected', tool === def.id);
      button.classList.toggle('locked', locked);
      button.classList.toggle('affordable', locked && score >= def.cost);
      button.querySelector('small').style.display = locked ? 'flex' : 'none';
    });
  }

  function buildToolbar() {
    TOOLS.forEach(function (def, index) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'tool';
      button.innerHTML = (index + 1) + '. ' + def.name +
        '<small><img src="assets/img/Souls_icon.png" alt="">Buy ' + def.cost + '</small>';
      button.addEventListener('click', function () { selectTool(def.id); });
      toolbar.appendChild(button);
      toolButtons[def.id] = button;
    });
    refreshTools();
  }

  // ---- Music ----

  function warpMusic(now) {
    var chaos = 1 + leak / 10;
    if (now > nextGlitchAt) {
      nextGlitchAt = now + rand(2500, 9000) / chaos;
      if (leak > 1) {
        glitchRate = pick(GLITCH_RATES);
        glitchUntil = now + rand(120, 400) * chaos;
        if (Math.random() < 0.5 && music.currentTime > 1) music.currentTime -= rand(0.2, 0.8);
      }
    }
    var glitching = now < glitchUntil;
    var rate = glitching
      ? glitchRate
      : BASE_RATE + Math.sin(now / 900) * 0.06 * chaos + Math.sin(now / 70) * 0.015 * chaos;
    music.playbackRate = clamp(rate, 0.25, 3);
    document.body.classList.toggle('glitch', glitching);
  }

  // ---- Drawing ----

  function draw(now) {
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    if (shake > 0.5) ctx.translate(rand(-shake, shake), rand(-shake, shake));

    ctx.fillStyle = 'rgba(232, 196, 106, 0.5)';
    ctx.fillRect(0, floorY, width, 2);

    var glow = leak / MAX_LEAK;
    if (glow > 0.02) {
      var gradient = ctx.createRadialGradient(urn.x, urn.y, 0, urn.x, urn.y, urn.h);
      gradient.addColorStop(0, 'rgba(125, 255, 208, ' + (0.55 * glow) + ')');
      gradient.addColorStop(1, 'rgba(125, 255, 208, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(urn.x - urn.h, urn.y - urn.h, urn.h * 2, urn.h * 2);
    }

    ctx.save();
    ctx.translate(urn.x, urn.y);
    ctx.rotate(urn.a);
    ctx.drawImage(urnImg, -urn.w / 2, -urn.h / 2, urn.w, urn.h);
    ctx.restore();

    ctx.fillStyle = '#a4472f';
    bricks.forEach(function (brick) {
      ctx.save();
      ctx.translate(brick.x, brick.y);
      ctx.rotate(brick.a);
      ctx.fillRect(-16, -9, 32, 18);
      ctx.restore();
    });

    bombs.forEach(function (bomb) {
      var lit = Math.floor((now - bomb.born) / 90) % 2 === 0;
      ctx.fillStyle = '#0b1513';
      ctx.beginPath();
      ctx.arc(bomb.x, bomb.y, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#e8c46a';
      ctx.stroke();
      ctx.fillStyle = lit ? '#ff6b5e' : '#e8c46a';
      ctx.fillRect(bomb.x - 2, bomb.y - 22, 4, 8);
    });

    for (var b = blasts.length - 1; b >= 0; b--) {
      // The frame timestamp can be slightly older than a blast created during this frame.
      var t = Math.max(0, (now - blasts[b].born) / 350);
      if (t >= 1) { blasts.splice(b, 1); continue; }
      ctx.strokeStyle = 'rgba(255, 200, 120, ' + (1 - t) + ')';
      ctx.lineWidth = 14 * (1 - t);
      ctx.beginPath();
      ctx.arc(blasts[b].x, blasts[b].y, BOMB_RADIUS * t, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.lineWidth = 1;

    souls.forEach(function (soul) {
      var age = now - soul.born;
      var pulse = 1 + Math.sin(now / 150 + soul.sway) * 0.08;
      ctx.globalAlpha = clamp((SOUL_LIFE_MS - age) / 1000, 0, 1);
      ctx.drawImage(soulImg, soul.x - 13 * pulse, soul.y - 25 * pulse, 26 * pulse, 50 * pulse);
    });
    ctx.globalAlpha = 1;

    ctx.font = 'bold 22px Georgia, serif';
    ctx.textAlign = 'center';
    for (var i = texts.length - 1; i >= 0; i--) {
      var life = (now - texts[i].born) / 800;
      if (life >= 1) { texts.splice(i, 1); continue; }
      ctx.globalAlpha = 1 - life;
      ctx.fillStyle = texts[i].color;
      ctx.fillText(texts[i].text, texts[i].x, texts[i].y - life * 50);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function tick(now) {
    var dt = Math.min(0.033, (now - lastFrame) / 1000);
    lastFrame = now;
    updateUrn(now, dt);
    updateBricks(now, dt);
    updateBombs(now, dt);
    updateLeak(dt);
    updateSouls(now, dt);
    shake *= 1 - Math.min(1, 8 * dt);
    warpMusic(now);
    draw(now);
    placeBubble();
    requestAnimationFrame(tick);
  }

  // ---- Input ----

  function trackPointer(e) {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
  }

  function pressRoom(e) {
    trackPointer(e);
    var onUrn = checkInsideUrn(pointer.x, pointer.y);
    if (tool === 'hand' && onUrn) {
      urn.grabbed = true;
      urn.grabDx = pointer.x - urn.x;
      urn.grabDy = pointer.y - urn.y;
      urn.grabbedAt = performance.now();
      lastEventAt = urn.grabbedAt;
      say('idol_picked_up', false);
    } else if (tool === 'punch' && onUrn) {
      punchUrn(pointer.x, pointer.y);
    } else if (tool === 'brick') {
      throwBrick(pointer.x, pointer.y);
    } else if (tool === 'bomb') {
      placeBomb(pointer.x, pointer.y);
    }
  }

  function start() {
    startOverlay.remove();
    announce.play().catch(function () {});
    announce.addEventListener('ended', function () { music.play().catch(function () {}); });
    lastFrame = performance.now();
    lastEventAt = lastFrame;
    requestAnimationFrame(tick);
    say('idol_waiting', true);
  }

  window.addEventListener('resize', resize);
  canvas.addEventListener('pointerdown', pressRoom);
  window.addEventListener('pointermove', trackPointer);
  window.addEventListener('pointerup', releaseUrn);
  window.addEventListener('keydown', function (e) {
    var def = TOOLS[Number(e.key) - 1];
    if (def) selectTool(def.id);
  });
  startOverlay.addEventListener('click', start);

  resize();
  buildToolbar();
})();
</script>
</body>
</html>
